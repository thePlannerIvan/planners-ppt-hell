<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Corner Hairline Cross Markers -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="90" y1="100" x2="110" y2="100"/>
    <line x1="100" y1="90" x2="100" y2="110"/>
    <line x1="1810" y1="100" x2="1830" y2="100"/>
    <line x1="1820" y1="90" x2="1820" y2="110"/>
    <line x1="90" y1="980" x2="110" y2="980"/>
    <line x1="100" y1="970" x2="100" y2="990"/>
    <line x1="1810" y1="980" x2="1830" y2="980"/>
    <line x1="1820" y1="970" x2="1820" y2="990"/>
  </g>

  <!-- Top Metadata -->
  <text x="140" y="105" font-family='monospace' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">SWISS NEO-BRUTALIST // COCKPIT SYSTEM</text>
  <text x="1780" y="105" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">01 / 52 · MASTER COVER</text>

  <!-- Monumental Display Typography (145px bold white) -->
  <g font-family='system-ui, -apple-system, sans-serif' font-size="145" font-weight="900" fill="#FFFFFF" letter-spacing="-4">
    <text x="100" y="340">DEEP</text>
    <text x="100" y="490">COGNITION</text>
    <text x="100" y="640">FRAMEWORK</text>
  </g>

  <!-- Solid Electric Lime Puncture Block (x=1240, y=240, width=480, height=440) -->
  <g transform="translate(1240, 240)">
    <rect width="480" height="440" fill="#E2F827"/>
    <g transform="translate(45, 55)">
      <text x="0" y="25" font-family='monospace' font-size="18" font-weight="900" fill="#111111" letter-spacing="1">● MANIFESTO // 2026</text>
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">在充满同质化噪音的时代，</text>
      <text x="0" y="132" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">克制比喧嚣更有力量。</text>
      <text x="0" y="195" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="600" fill="#222222">留白是思维的重力场，</text>
      <text x="0" y="230" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="600" fill="#222222">大字是意志的穿甲弹。</text>
      <text x="0" y="265" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="600" fill="#222222">去卡片化，以排印重塑秩序。</text>

      <line x1="0" y1="310" x2="390" y2="310" stroke="#111111" stroke-width="1.5"/>
      <text x="0" y="350" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="900" fill="#111111">EXPLORE ARCHITECTURE -&gt;</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Bottom Grid Micro-Metadata -->
  <g transform="translate(100, 930)">
    <text x="0" y="30" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">COORDINATES: [ 31.2304° N, 121.4737° E ]</text>
    <text x="460" y="30" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">DESIGN CORE: SWISS TYPOGRAPHY // RADICAL RESTRAINT</text>
    <text x="1720" y="30" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER // IVAN</text>
  </g>
</svg>