<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">28 / 33 · DUAL TIER DOCTRINE</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">MEGA-NUMERAL</text>

  <!-- Central Horizontal Line dividing Tier 1 & Tier 2 -->
  <line x1="100" y1="520" x2="1820" y2="520" stroke="#111111" stroke-width="2"/>

  <!-- Tier 01 (y=160..480) -->
  <g transform="translate(100, 160)">
    <!-- Mega Numeral 01 -->
    <text x="0" y="220" font-family='system-ui, -apple-system, sans-serif' font-size="200" font-weight="900" fill="#111111" letter-spacing="-10">01</text>

    <!-- Content to the right of 01 -->
    <g transform="translate(380, 40)">
      <text x="0" y="45" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">THE ENTERPRISE ERA BEGINS</text>
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">确立以认知重力为核心的品牌与产品叙事标准，彻底颠覆同质化旧模式。</text>

      <g transform="translate(0, 140)">
        <rect width="220" height="38" rx="19" fill="#111111"/>
        <text x="110" y="24" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 01 // LOCKED</text>
      </g>
    </g>
  </g>

  <!-- Tier 02 (y=560..880) -->
  <g transform="translate(100, 560)">
    <!-- Mega Numeral 02 -->
    <text x="0" y="220" font-family='system-ui, -apple-system, sans-serif' font-size="200" font-weight="900" fill="#111111" letter-spacing="-10">02</text>

    <!-- Content to the right of 02 -->
    <g transform="translate(380, 40)">
      <text x="0" y="45" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111" letter-spacing="-1">MUTANT &amp; PROUD: ZERO DEFECT</text>
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">以极客工程精神追求绝对质量闭环，用确定性成果兑现最高商业契约。</text>

      <g transform="translate(0, 140)">
        <rect width="220" height="38" rx="19" fill="#111111"/>
        <text x="110" y="24" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 02 // ACTIVE</text>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SWISS DUAL HORIZON // SCALE CONTRAST</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>