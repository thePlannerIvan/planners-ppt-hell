    <text x="0" y="40" font-family='system-ui, -apple-system, sans-serif' font-size="32" font-weight="900" fill="#FFFFFF">将汇报从「信息的容器」转化为「意志的武器」。</text>
    <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#8E92A4">以大排印建立视觉重力，以大留白制造心理压迫，让决策者无法忽视关键结论。</text>
    <text x="0" y="140" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827">PAGE 08 // RADICAL CLARITY OVER DECORATION</text>
