    <text x="-90" y="600" font-family='monospace' font-size="15" font-weight="900" fill="#E2F827">WEEK 06</text>
    <text x="-90" y="630" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="800" fill="#FFFFFF">Delivery Pass</text>
    <text x="-90" y="658" font-family='system-ui, -apple-system, sans-serif' font-size="14" font-weight="500" fill="#9CA3AF">零缺陷全案终审交付</text>
  </g>

  <!-- Bottom Deliverables Black Container (x=100, y=725, w=1720, h=120, BORDERLESS) -->
  <g transform="translate(100, 725)">
    <rect width="1720" height="120" rx="12" fill="#111111"/>
    <g transform="translate(50, 45)">
      <text x="0" y="25" font-family='monospace' font-size="18" font-weight="900" fill="#E2F827">[DELIVERABLES]</text>
      <g transform="translate(180, 0)">
        <text x="0" y="25" font-family='monospace' font-size="16" font-weight="800" fill="#FFFFFF">01 // SOURCE PACK</text>
        <text x="360" y="25" font-family='monospace' font-size="16" font-weight="800" fill="#FFFFFF">02 // STRATEGY SPEC</text>
        <text x="740" y="25" font-family='monospace' font-size="16" font-weight="800" fill="#FFFFFF">03 // BY-PAGE DECK</text>
        <text x="1120" y="25" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">04 // PRODUCTION PPTX</text>
