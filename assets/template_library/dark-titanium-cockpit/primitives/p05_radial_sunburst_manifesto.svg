<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Top Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">05 / 52 · ENERGY MATRIX</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">RADIAL FIELD</text>

  <!-- Sunburst Rays radiating from cx=960, cy=520 -->
  <g stroke="#1F2330" stroke-width="1.5">
    <line x1="960" y1="140" x2="960" y2="900"/>
    <line x1="580" y1="520" x2="1340" y2="520"/>
    <line x1="691" y1="251" x2="1228" y2="788"/>
    <line x1="691" y1="788" x2="1228" y2="251"/>
    <line x1="611" y1="365" x2="1308" y2="674"/>
    <line x1="611" y1="674" x2="1308" y2="365"/>
    <line x1="795" y1="171" x2="1124" y2="868"/>
    <line x1="1124" y1="171" x2="795" y2="868"/>
  </g>

  <!-- Electric Accent Concentric Rings -->
  <circle cx="960" cy="520" r="340" fill="none" stroke="#222533" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="960" cy="520" r="220" fill="none" stroke="#E2F827" stroke-width="1" stroke-dasharray="2 6"/>
  <circle cx="960" cy="520" r="80" fill="#0C0D11" stroke="#E2F827" stroke-width="2"/>

  <!-- Monumental Center Typography Overlay -->
  <text x="960" y="480" font-family='system-ui, -apple-system, sans-serif' font-size="96" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">RADICAL</text>
  <text x="960" y="585" font-family='system-ui, -apple-system, sans-serif' font-size="96" font-weight="900" fill="#E2F827" text-anchor="middle" letter-spacing="-2">FOCUS</text>

  <!-- Four Corner Micro-Annotations -->
  <g font-family='monospace' font-size="16" font-weight="700">
    <text x="140" y="240" fill="#6B7280">// VECTOR A: COGNITIVE GRAVITY</text>
    <text x="140" y="270" fill="#D1D5DB" font-size="18">01. 排除同质化噪音</text>

    <text x="1780" y="240" fill="#6B7280" text-anchor="end">// VECTOR B: VALUE CONCENTRATION</text>
    <text x="1780" y="270" fill="#D1D5DB" font-size="18" text-anchor="end">02. 穿透单点认知支点</text>

    <text x="140" y="800" fill="#6B7280">// VECTOR C: ARCHITECTURAL PURITY</text>
    <text x="140" y="830" fill="#D1D5DB" font-size="18">03. 以排印重构秩序</text>

    <text x="1780" y="800" fill="#6B7280" text-anchor="end">// VECTOR D: ABSOLUTE CLARITY</text>
    <text x="1780" y="830" fill="#D1D5DB" font-size="18" text-anchor="end">04. 极度克制方显力量</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SWISS RADIAL GEOMETRY // CENTER OF GRAVITY</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>