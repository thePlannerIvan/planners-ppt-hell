    <text x="750" y="48" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">戳破自嗨型品类偏见，锚定核心客群真实痛点</text>
    <text x="1500" y="48" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111" text-anchor="end">02</text>

