    <text x="0" y="208" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">03 · 心智资产立碑 // POSITIONING ASSET</text>
    <text x="750" y="208" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">打造不可替代的视觉符码与品类记忆点</text>
    <text x="1500" y="208" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111" text-anchor="end">04</text>

    <!-- Row 4 -->
    <line x1="0" y1="240" x2="1520" y2="240" stroke="#111111" stroke-width="1.5"/>
    <text x="0" y="288" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">04 · 跨周期交付矩阵 // DELIVERABLE CADENCE</text>
    <text x="750" y="288" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">从发布会原爆点到终端阵列的分阶段渗透</text>
    <text x="1500" y="288" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111" text-anchor="end">05</text>

    <!-- Row 5 -->
