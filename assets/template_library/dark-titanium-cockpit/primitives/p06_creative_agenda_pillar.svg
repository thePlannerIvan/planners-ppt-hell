    <text x="0" y="368" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">05 · 决策共识闭环 // CONSENSUS CLOSURE</text>
    <text x="750" y="368" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">通过逐页事实审计与高层对齐确保方案落地</text>
    <text x="1500" y="368" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111" text-anchor="end">06</text>
    <line x1="0" y1="400" x2="1520" y2="400" stroke="#111111" stroke-width="1.5"/>
  </g>

  <!-- Bottom Horizontal Giant Numbers Sequence -->
  <g transform="translate(300, 780)">
    <g transform="translate(0, 0)">
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111">02</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280">Campaign</text>
    </g>
    <g transform="translate(300, 0)">
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111">03</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280">Target Audience</text>
    </g>
    <g transform="translate(600, 0)">
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111">04</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280">References</text>
    </g>
    <g transform="translate(900, 0)">
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111">05</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280">Deliverables</text>
    </g>
    <g transform="translate(1200, 0)">
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111">06</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280">Practical Facts</text>
    </g>
