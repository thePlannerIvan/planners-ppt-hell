    <line x1="0" y1="80" x2="1520" y2="80" stroke="#111111" stroke-width="1.5"/>
    <text x="0" y="128" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">02 · 战略叙事重构 // STRATEGIC REFRAME</text>
