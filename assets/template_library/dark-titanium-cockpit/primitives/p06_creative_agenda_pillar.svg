    <text x="0" y="230" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">报</text>

    <line x1="0" y1="280" x2="44" y2="280" stroke="#111111" stroke-width="2"/>

    <text x="8" y="340" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">C</text>
    <text x="8" y="370" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">R</text>
    <text x="8" y="400" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">E</text>
    <text x="8" y="430" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">A</text>
    <text x="8" y="460" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">T</text>
    <text x="8" y="490" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">I</text>
    <text x="8" y="520" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">V</text>
    <text x="8" y="550" font-family='monospace' font-size="18" font-weight="800" fill="#6B7280">E</text>
  </g>

  <!-- Organic Electric Lime Highlighter Marker Strokes -->
  <path d="M 850 180 Q 1050 130 1280 190 T 1600 170" fill="none" stroke="#E2F827" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 1480 340 L 1580 400 L 1490 460 L 1600 520 L 1500 580 L 1610 640" fill="none" stroke="#E2F827" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

