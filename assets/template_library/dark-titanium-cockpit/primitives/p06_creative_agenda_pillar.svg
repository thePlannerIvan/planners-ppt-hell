  <g transform="translate(300, 160)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="72" font-weight="900" fill="#111111" letter-spacing="-2">Agenda // 议程与核心交付</text>
    <text x="0" y="105" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#4B5563">跳出传统汇报的堆砌死板，以结构化议程定义认知破局全流程。</text>
  </g>

