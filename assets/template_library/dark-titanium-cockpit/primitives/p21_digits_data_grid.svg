<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Top Header Metadata -->
  <text x="100" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" letter-spacing="1">21 / 52 · DATA-DRIVEN VALIDATION SUITE</text>
  <text x="1820" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#717680" text-anchor="end">DIGITS ARCHITECTURE</text>

  <!-- Left Column: Typographic Anchor (x=100) -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="10" height="140" fill="#E2F827"/>
    <text x="28" y="52" font-family='system-ui, -apple-system, sans-serif' font-size="64" font-weight="900" fill="#111111" letter-spacing="-2">DIGITS IN</text>
    <text x="28" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="64" font-weight="900" fill="#111111" letter-spacing="-2">NUMBERS</text>

    <!-- Highlighter Bar under description -->
    <rect x="0" y="180" width="180" height="14" fill="#E2F827"/>
    
    <text x="0" y="240" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="600" fill="#111111">以极高颗粒度的数据沉淀，</text>
    <text x="0" y="275" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="600" fill="#111111">穿透表象自嗨与主观偏见。</text>
    <text x="0" y="325" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#555555">覆盖 1,000+ 核心消费触点与数千万级互动行为，</text>
    <text x="0" y="355" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#555555">在严谨网格中呈现真正有商业穿透力的证据链条。</text>

    <!-- Arrow Block at bottom left -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="100" height="100" fill="#E2F827"/>
      <line x1="28" y1="50" x2="68" y2="50" stroke="#111111" stroke-width="3"/>
      <polyline points="56,38 68,50 56,62" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(130, 520)">
      <rect x="0" y="0" width="18" height="18" fill="#111111"/>
      <rect x="22" y="22" width="18" height="18" fill="#111111"/>
    </g>
  </g>

  <!-- Right Column: Architectural Grid (x=680, y=180, width=1140, height=760) -->
  <g transform="translate(680, 180)">
    <!-- Thin Grid Border -->
    <rect x="0" y="0" width="1140" height="740" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="570" y1="0" x2="570" y2="440" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="0" y1="220" x2="1140" y2="220" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="0" y1="440" x2="1140" y2="440" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="0" y1="640" x2="1140" y2="640" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="285" y1="640" x2="285" y2="740" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="570" y1="640" x2="570" y2="740" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="855" y1="640" x2="855" y2="740" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Cell 1: Top-Left (12.8M) -->
    <g transform="translate(50, 40)">
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111" letter-spacing="-2">12.8M</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#6B7280">Transactions Processed // 全周期行为交互沉淀</text>
    </g>

    <!-- Cell 2: Top-Right (41M) -->
    <g transform="translate(620, 40)">
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111" letter-spacing="-2">41M</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#6B7280">Total Revenue Impacted ($) // 验证溢价规模</text>
    </g>

    <!-- Cell 3: Mid-Left (15.4M) -->
    <g transform="translate(50, 260)">
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#111111" letter-spacing="-2">15.4M</text>
      <text x="0" y="130" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#6B7280">Users Engaged // 深度触达核心人群</text>
    </g>

    <!-- Cell 4: Mid-Right (+98.7% / Key Metric) -->
    <g transform="translate(620, 260)">
      <text x="0" y="45" font-family='monospace' font-size="18" font-weight="800" fill="#111111" letter-spacing="1">● KEY CONVERSION RATIO</text>
      <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="70" font-weight="900" fill="#111111" letter-spacing="-1">+98.7%</text>
      <text x="0" y="150" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#6B7280">Market Penetration Index // 认知突破增长斜率</text>
    </g>

    <!-- Cell 5: SOLID ELECTRIC LIME HERO BLOCK (y=440 to 640) -->
    <rect x="0" y="440" width="1140" height="200" fill="#E2F827"/>
    <g transform="translate(50, 465)">
      <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="130" font-weight="900" fill="#111111" letter-spacing="-4">85.6M</text>
      <text x="540" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#111111">Data Points Analyzed</text>
      <text x="540" y="105" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#111111">穿透式事实证据底座 · 全量通过一致性稽核</text>
      <rect x="540" y="125" width="220" height="34" rx="6" fill="#111111"/>
      <text x="555" y="148" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827">LIVE AUDIT PASSED</text>
    </g>

    <!-- Bottom row cells: 01 marker -->
    <text x="142" y="700" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="900" fill="#111111" text-anchor="middle">01</text>
    <text x="427" y="700" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#9CA3AF" text-anchor="middle">MARKET</text>
    <text x="712" y="700" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#9CA3AF" text-anchor="middle">AUDIENCE</text>
    <text x="997" y="700" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#9CA3AF" text-anchor="middle">CONVERSION</text>
  </g>
</svg>