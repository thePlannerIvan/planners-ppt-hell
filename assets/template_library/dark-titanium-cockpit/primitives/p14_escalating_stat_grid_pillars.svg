<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Top Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">14 / 52 · CREDIBILITY BENCHMARKS</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">ESCALATING PILLARS</text>

  <!-- Slide Title -->
  <g transform="translate(100, 160)">
    <text x="0" y="44" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">CREDIBILITY &amp; SCALE</text>
    <text x="0" y="86" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#9CA3AF">Clean, intentional layouts signal institutional credibility and discipline.</text>
  </g>

  <!-- 3 Escalating Pillars (x=100, 680, 1260; w=560) -->

  <!-- Pillar 1: $50M -->
  <g transform="translate(100, 320)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="-3">$50m</text>
    <text x="0" y="105" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF">Avoid overloading slides</text>

    <!-- Grid Wireframe Container (height 320) -->
    <g transform="translate(0, 130)">
      <rect width="520" height="320" fill="none" stroke="#222533" stroke-width="1.5"/>
      <line x1="130" y1="70" x2="130" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="260" y1="70" x2="260" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="390" y1="70" x2="390" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="80" x2="520" y2="80" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="160" x2="520" y2="160" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="240" x2="520" y2="240" stroke="#1C1F2B" stroke-width="1"/>
      <text x="26" y="45" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">STAGE 01 // SEED CORE</text>
    </g>
  </g>

  <!-- Pillar 2: $75M -->
  <g transform="translate(680, 320)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="-3">$75m</text>
    <text x="0" y="105" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF">Whether it’s an idea</text>

    <!-- Grid Wireframe Container (height 320) -->
    <g transform="translate(0, 130)">
      <rect width="520" height="320" fill="none" stroke="#222533" stroke-width="1.5"/>
      <line x1="130" y1="70" x2="130" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="260" y1="70" x2="260" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="390" y1="70" x2="390" y2="320" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="80" x2="520" y2="80" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="160" x2="520" y2="160" stroke="#1C1F2B" stroke-width="1"/>
      <line x1="0" y1="240" x2="520" y2="240" stroke="#1C1F2B" stroke-width="1"/>
      <text x="26" y="45" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">STAGE 02 // SCALE EXPANSION</text>
    </g>
  </g>

  <!-- Pillar 3: $100M (Highlighted in Electric Lime) -->
  <g transform="translate(1260, 320)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="80" font-weight="900" fill="#E2F827" letter-spacing="-3">$100m</text>
    <text x="0" y="105" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#FFFFFF">Clean, intentional layouts</text>

    <!-- Grid Wireframe Container (height 320) -->
    <g transform="translate(0, 130)">
      <rect width="520" height="320" fill="#14161F" stroke="#E2F827" stroke-width="1.5"/>
      <line x1="130" y1="70" x2="130" y2="320" stroke="#222533" stroke-width="1"/>
      <line x1="260" y1="70" x2="260" y2="320" stroke="#222533" stroke-width="1"/>
      <line x1="390" y1="70" x2="390" y2="320" stroke="#222533" stroke-width="1"/>
      <line x1="0" y1="80" x2="520" y2="80" stroke="#222533" stroke-width="1"/>
      <line x1="0" y1="160" x2="520" y2="160" stroke="#222533" stroke-width="1"/>
      <line x1="0" y1="240" x2="520" y2="240" stroke="#222533" stroke-width="1"/>
      <text x="26" y="45" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">STAGE 03 // MATURE VELOCITY</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">FINANCIAL RIGOR // NO ARBITRARY DECORATION</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>