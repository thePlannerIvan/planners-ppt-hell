<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Top Brutalist Web Navigation Bar (x=100, y=70, w=1720, h=64) -->
  <g transform="translate(100, 70)">
    <rect width="1720" height="64" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <g font-family='monospace' font-size="16" font-weight="800" fill="#111111">
      <text x="50" y="38">01 // OVERVIEW</text>
      <line x1="344" y1="0" x2="344" y2="64" stroke="#111111" stroke-width="1.5"/>

      <text x="394" y="38">02 // ARCHITECTURE</text>
      <line x1="688" y1="0" x2="688" y2="64" stroke="#111111" stroke-width="1.5"/>

      <text x="738" y="38">03 // BENCHMARKS</text>
      <line x1="1032" y1="0" x2="1032" y2="64" stroke="#111111" stroke-width="1.5"/>

      <text x="1082" y="38">04 // AUDIT PROOF</text>
      <line x1="1376" y1="0" x2="1376" y2="64" stroke="#111111" stroke-width="1.5"/>

      <text x="1426" y="38" fill="#E2F827">● 05 // SYSTEM LOGS</text>
    </g>
  </g>

  <!-- Main Left Container (x=100, y=170, w=840, h=680) -->
  <g transform="translate(100, 170)">
    <rect width="840" height="680" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <g transform="translate(60, 60)">
      <text x="0" y="30" font-family='monospace' font-size="18" font-weight="900" fill="#6B7280">// STRATEGIC MEMORANDUM</text>
      <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">SIGNING THE NEW</text>
      <text x="0" y="145" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">COGNITIVE CONTRACT</text>

      <text x="0" y="220" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">完全告别碎片化 PPT 制作模式，</text>
      <text x="0" y="255" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">将每一张幻灯片确立为可验证的战略指令集。</text>
      <text x="0" y="290" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">用严格的架构、高精度排版与零冗余留白，</text>
      <text x="0" y="325" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">赋予商业报告无懈可击的说服力。</text>

      <line x1="0" y1="400" x2="720" y2="400" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Meta Pill -->
      <g transform="translate(0, 460)">
        <rect width="280" height="42" rx="21" fill="#111111"/>
        <text x="140" y="27" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">RATIFIED // EXECUTED</text>
      </g>
    </g>
  </g>

  <!-- Right Drawer Container (x=980, y=170, w=840, h=680) -->
  <g transform="translate(980, 170)">
    <rect width="840" height="680" fill="#14161F"/>
    <g transform="translate(60, 60)">
      <text x="0" y="30" font-family='monospace' font-size="18" font-weight="900" fill="#E2F827">// SYSTEM PARAMETERS &amp; CONSTRAINTS</text>
      <text x="0" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="32" font-weight="900" fill="#FFFFFF">THREE OPERATIONAL PRINCIPLES</text>

      <!-- Parameter Row 1 -->
      <g transform="translate(0, 140)">
        <line x1="0" y1="0" x2="720" y2="0" stroke="#282C3D" stroke-width="1"/>
        <text x="0" y="35" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">01 / CONSTRAINT</text>
        <text x="0" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#FFFFFF">单屏单焦点：绝不同屏承载两个平等结论</text>
      </g>

      <!-- Parameter Row 2 -->
      <g transform="translate(0, 250)">
        <line x1="0" y1="0" x2="720" y2="0" stroke="#282C3D" stroke-width="1"/>
        <text x="0" y="35" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">02 / CONSTRAINT</text>
        <text x="0" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#FFFFFF">几何对齐严格度：所有边界坐标锁定于网格模数</text>
      </g>

      <!-- Parameter Row 3 -->
      <g transform="translate(0, 360)">
        <line x1="0" y1="0" x2="720" y2="0" stroke="#282C3D" stroke-width="1"/>
        <text x="0" y="35" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">03 / CONSTRAINT</text>
        <text x="0" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#FFFFFF">色彩克制律：75% 曜石底、20% 钛灰字、5% 荧光重音</text>
        <line x1="0" y1="100" x2="720" y2="100" stroke="#282C3D" stroke-width="1"/>
      </g>

      <!-- Bottom Status Button -->
      <g transform="translate(0, 500)">
        <rect width="280" height="44" fill="#E2F827"/>
        <text x="140" y="28" font-family='monospace' font-size="16" font-weight="900" fill="#111111" text-anchor="middle">VERIFIED ENGINE -&gt;</text>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">BRUTALIST WEB INTERACTION // ASYMMETRIC VIEWPORT</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>