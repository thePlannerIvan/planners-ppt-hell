<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Top Metadata -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">12 / 52 · MECHANISM QUADRANT</text>
  <text x="1820" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">FOUR-PILLAR MONOLITH</text>

  <!-- 4 Tall Vertical Bounded Columns -->
  <!-- Dividers between columns -->
  <line x1="530" y1="160" x2="530" y2="960" stroke="#22252E" stroke-width="1.5"/>
  <line x1="960" y1="160" x2="960" y2="960" stroke="#22252E" stroke-width="1.5"/>
  <line x1="1390" y1="160" x2="1390" y2="960" stroke="#22252E" stroke-width="1.5"/>

  <!-- Column 1 -->
  <g transform="translate(100, 180)">
    <text x="0" y="300" font-family='system-ui, -apple-system, sans-serif' font-size="320" font-weight="100" fill="#1C1F28" letter-spacing="-10">1</text>
    <g transform="translate(10, 480)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#181B24"/>
      <text x="55" y="21" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 01</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">原声穿透诊断</text>
      <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">锁定 3 大核心自嗨偏见，</text>
      <text x="0" y="155" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">建立真实证据基线。</text>
    </g>
  </g>

  <!-- Column 2 -->
  <g transform="translate(550, 180)">
    <text x="0" y="300" font-family='system-ui, -apple-system, sans-serif' font-size="320" font-weight="100" fill="#1C1F28" letter-spacing="-10">2</text>
    <g transform="translate(10, 480)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#181B24"/>
      <text x="55" y="21" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 02</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">叙事极化重构</text>
      <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">将工业感偏见重构为</text>
      <text x="0" y="155" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">极客科技纯粹性主张。</text>
    </g>
  </g>

  <!-- Column 3 -->
  <g transform="translate(980, 180)">
    <text x="0" y="300" font-family='system-ui, -apple-system, sans-serif' font-size="320" font-weight="100" fill="#1C1F28" letter-spacing="-10">3</text>
    <g transform="translate(10, 480)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#181B24"/>
      <text x="55" y="21" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 03</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">心智资产立碑</text>
      <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">打造绝对排他性符码，</text>
      <text x="0" y="155" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">沉淀长效品牌溢价。</text>
    </g>
  </g>

  <!-- Column 4 -->
  <g transform="translate(1410, 180)">
    <text x="0" y="300" font-family='system-ui, -apple-system, sans-serif' font-size="320" font-weight="100" fill="#1C1F28" letter-spacing="-10">4</text>
    <g transform="translate(10, 480)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#181B24"/>
      <text x="55" y="21" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827" text-anchor="middle">PHASE 04</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">战役闭环兑现</text>
      <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">全域货架穿透渗透，</text>
      <text x="0" y="155" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">实现心智与商业双丰收。</text>
    </g>
  </g>
</svg>