<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">16 / 52 · INTERLOCKING ARCHITECTURE</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">MODULAR FLOW</text>

  <!-- Block 1: Left-aligned Dark (x=100, y=180, w=1100, h=180) -->
  <g transform="translate(100, 180)">
    <rect width="1100" height="180" fill="#14161F" stroke="#282C3D" stroke-width="1.5"/>
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">01 // 09:30 AM</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="36" font-weight="900" fill="#FFFFFF">STRATEGIC DIAGNOSIS &amp; PROBLEM AUDIT</text>
      <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#9CA3AF">穿透业务真实困境，剔除伪命题与低价值干扰</text>
    </g>
  </g>

  <!-- Block 2: Right-aligned Electric Lime Hero (x=720, y=400, w=1100, h=180) -->
  <g transform="translate(720, 400)">
    <rect width="1100" height="180" fill="#E2F827"/>
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family='monospace' font-size="16" font-weight="900" fill="#111111">02 // 14:00 PM · CRITICAL PIVOT</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="36" font-weight="900" fill="#111111">METHODOLOGICAL SYNTHESIS</text>
      <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#222222">重构认知解法框架，建立不可撼动的先发优势</text>
    </g>
  </g>

  <!-- Block 3: Left-aligned Dark (x=100, y=620, w=1100, h=180) -->
  <g transform="translate(100, 620)">
    <rect width="1100" height="180" fill="#14161F" stroke="#E2F827" stroke-width="1.5"/>
    <g transform="translate(45, 45)">
      <text x="0" y="30" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">03 // 17:45 PM</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="36" font-weight="900" fill="#FFFFFF">CAPITAL ALLOCATION &amp; DEPLOYMENT</text>
      <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#9CA3AF">战略资源集中下注，按阶段门禁兑现商业成果</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">INTERLOCKING MASONRY // DYNAMIC HORIZONTAL CADENCE</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>