<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">39 / 45 · EXPONENTIAL TRAJECTORY</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">HORIZON ASCENDING BARS</text>

  <!-- Left Narrative Column (x=100..740) -->
  <g transform="translate(100, 180)">
    <text x="0" y="25" font-family='monospace' font-size="18" font-weight="900" fill="#E2F827">// CAPITAL EFFICIENCY HORIZON</text>
    <text x="0" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#FFFFFF">PROJECTED REVENUE</text>
    <text x="0" y="145" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#FFFFFF">ACROSS QUADRANTS</text>

    <text x="0" y="230" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#9CA3AF">得益于微内核架构与高度自动化的子代理流水线，</text>
    <text x="0" y="265" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#9CA3AF">团队人效与边际交付毛利率呈现陡峭阶跃上升。</text>
    <text x="0" y="300" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#9CA3AF">每一阶段均设立不可逆的财务验证闸门。</text>

    <!-- Bullets -->
    <g transform="translate(0, 370)">
      <text x="0" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827">[01] GROSS MARGIN: 84.5% STABLE</text>
      <text x="0" y="60" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827">[02] CAC PAYBACK: 4.2 MONTHS AVERAGE</text>
      <text x="0" y="100" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827">[03] NRR EXPANSION: 142% ANNUALLY</text>
    </g>

    <!-- Meta Pill -->
    <g transform="translate(0, 520)">
      <rect width="280" height="42" rx="21" fill="#1E2433"/>
      <text x="140" y="27" font-family='monospace' font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">FINANCIAL GOAL // AUDITED</text>
    </g>
  </g>

  <!-- Right Stage: Horizon Ascending Rounded Bars (x=840..1820, borderless floating bars) -->
  <g transform="translate(840, 180)">
    <!-- Ground Horizon Line at y=540 spanning to 1820 (width 980) -->
    <line x1="0" y1="540" x2="980" y2="540" stroke="#374151" stroke-width="2"/>

    <!-- 4 Ascending Tall Rounded Bars (Borderless Tonal Bars) -->
    <!-- Col 1: 2023 ($1.8M, h=180, y=360) -->
    <g transform="translate(50, 0)">
      <rect x="0" y="360" width="160" height="180" rx="16" fill="#1C2333"/>
      <text x="80" y="335" font-family='monospace' font-size="24" font-weight="900" fill="#9CA3AF" text-anchor="middle">$1.8M</text>
      <text x="80" y="580" font-family='monospace' font-size="18" font-weight="800" fill="#9CA3AF" text-anchor="middle">2023</text>
      <text x="80" y="610" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#6B7280" text-anchor="middle">Base Year</text>
    </g>

    <!-- Col 2: 2024 ($2.5M, h=270, y=270) -->
    <g transform="translate(290, 0)">
      <rect x="0" y="270" width="160" height="270" rx="16" fill="#29354E"/>
      <text x="80" y="245" font-family='monospace' font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">$2.5M</text>
      <text x="80" y="580" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">2024</text>
      <text x="80" y="610" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">+38.8% YoY</text>
    </g>

    <!-- Col 3: 2025 ($3.6M, h=370, y=170) -->
    <g transform="translate(530, 0)">
      <rect x="0" y="170" width="160" height="370" rx="16" fill="#3E4F73"/>
      <text x="80" y="145" font-family='monospace' font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">$3.6M</text>
      <text x="80" y="580" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">2025</text>
      <text x="80" y="610" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#9CA3AF" text-anchor="middle">+44.0% YoY</text>
    </g>

    <!-- Col 4: 2026 Target ($5.2M, h=480, y=60 Highlight Lime) -->
    <g transform="translate(770, 0)">
      <rect x="0" y="60" width="160" height="480" rx="16" fill="#E2F827"/>
      <text x="80" y="35" font-family='monospace' font-size="28" font-weight="900" fill="#E2F827" text-anchor="middle">$5.2M*</text>
      <text x="80" y="580" font-family='monospace' font-size="18" font-weight="900" fill="#E2F827" text-anchor="middle">2026</text>
      <text x="80" y="610" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="700" fill="#E2F827" text-anchor="middle">TARGET GOAL</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#282C3D" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#9CA3AF">HORIZON ROUNDED COLUMNS // CAPITAL EFFICIENCY TRAJECTORY</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>