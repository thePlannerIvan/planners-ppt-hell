<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">20 / 33 · QUANTUM MULTIPLIER</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">NUMERAL APERTURE</text>

  <!-- Left Monumental Numeral 35 (x=100..750) -->
  <g transform="translate(100, 240)">
    <!-- Giant Numeral -->
    <text x="0" y="380" font-family='system-ui, -apple-system, sans-serif' font-size="280" font-weight="900" fill="#111111" letter-spacing="-12">35</text>

    <!-- Dark Cutout Box Layered over the Numeral -->
    <g transform="translate(340, 80)">
      <rect width="320" height="340" fill="#111111"/>
      <g transform="translate(30, 45)">
        <text x="0" y="25" font-family='monospace' font-size="16" font-weight="900" fill="#E2F827">● APERTURE 01</text>
        <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="800" fill="#FFFFFF">基础工程重构</text>
        <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#9CA3AF">重构数据底层链路，</text>
        <text x="0" y="155" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#9CA3AF">压缩无效流转环节，</text>
        <text x="0" y="185" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#9CA3AF">实现端到端性能突围。</text>

        <line x1="0" y1="225" x2="260" y2="225" stroke="#333333" stroke-width="1"/>
        <text x="0" y="260" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">INDEX: #35-CORE-ALPHA</text>
      </g>
    </g>
  </g>

  <!-- Right Stage Narrative Architecture (x=840..1820) -->
  <g transform="translate(840, 220)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">35x 生产力跃迁的</text>
    <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">底层工程解构</text>

    <text x="0" y="210" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#374151">当基础设施层被重构为全自动流水线，</text>
    <text x="0" y="248" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#374151">产出的爆发不是渐进线性增长，而是结构性量级突围。</text>

    <!-- Three Analytical Cards -->
    <g transform="translate(0, 310)">
      <!-- Card A -->
      <g transform="translate(0, 0)">
        <rect width="290" height="200" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="25" y="45" font-family='monospace' font-size="16" font-weight="800" fill="#6B7280">PHASE A</text>
        <text x="25" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="800" fill="#111111">自动化管线</text>
        <text x="25" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="400" fill="#4B5563">取代手工排版拼接</text>
        <text x="25" y="155" font-family='monospace' font-size="16" font-weight="700" fill="#10B981">+12.4x GAIN</text>
      </g>

      <!-- Card B -->
      <g transform="translate(320, 0)">
        <rect width="290" height="200" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="25" y="45" font-family='monospace' font-size="16" font-weight="800" fill="#6B7280">PHASE B</text>
        <text x="25" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="800" fill="#111111">高精度几何规则</text>
        <text x="25" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="400" fill="#4B5563">消除人工对齐误差</text>
        <text x="25" y="155" font-family='monospace' font-size="16" font-weight="700" fill="#10B981">+14.2x GAIN</text>
      </g>

      <!-- Card C (Highlighted) -->
      <g transform="translate(640, 0)">
        <rect width="290" height="200" fill="#111111"/>
        <text x="25" y="45" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">● PHASE C // NET</text>
        <text x="25" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="800" fill="#FFFFFF">整体穿甲效能</text>
        <text x="25" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="400" fill="#D1D5DB">战略说服力质变</text>
        <text x="25" y="155" font-family='monospace' font-size="16" font-weight="900" fill="#E2F827">35.0x TOTAL</text>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SWISS EDITORIAL COLLAGE // LAYERED APERTURE</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>