<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>
  <!-- Corner Hairline Cross Markers -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="90" y1="80" x2="110" y2="80"/>
    <line x1="100" y1="70" x2="100" y2="90"/>
    <line x1="1810" y1="80" x2="1830" y2="80"/>
    <line x1="1820" y1="70" x2="1820" y2="90"/>
    <line x1="90" y1="940" x2="110" y2="940"/>
    <line x1="100" y1="930" x2="100" y2="950"/>
    <line x1="1810" y1="940" x2="1830" y2="940"/>
    <line x1="1820" y1="930" x2="1820" y2="950"/>
  </g>
  <!-- Top Running Header (y=80) -->
  <text x="140" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" letter-spacing="2">37 / 52 · ASYMMETRIC DUAL-DETAIL + HERO MONOLITH</text>
  <text x="1780" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#9CA3AF" text-anchor="end">ELIZABETH BENNET COLLAGE</text>
  <!-- Left Stacked Detail Frames (x=100..720, w=620, y=140) -->
  <g transform="translate(100, 140)">
    <clipPath id="dt1Clip54">
      <rect width="620" height="340"/>
    </clipPath>
    <g clip-path="url(#dt1Clip54)">
      <image href="../assets/abstract_placeholder.jpg" x="0" y="0" width="620" height="340" preserveAspectRatio="xMidYMid slice"/>
      <rect x="20" y="20" width="160" height="28" rx="2" fill="#0C0D11" fill-opacity="0.9"/>
      <text x="100" y="39" font-family='monospace' font-size="13" font-weight="700" fill="#E2F827" text-anchor="middle">DETAIL 01 // FACET</text>
    </g>
  </g>

  <g transform="translate(100, 510)">
    <clipPath id="dt2Clip54">
      <rect width="620" height="340"/>
    </clipPath>
    <g clip-path="url(#dt2Clip54)">
      <image href="../assets/abstract_placeholder.jpg" x="0" y="0" width="620" height="340" preserveAspectRatio="xMidYMid slice"/>
      <rect x="20" y="20" width="160" height="28" rx="2" fill="#0C0D11" fill-opacity="0.9"/>
      <text x="100" y="39" font-family='monospace' font-size="13" font-weight="700" fill="#E2F827" text-anchor="middle">DETAIL 02 // APEX</text>
    </g>
  </g>

  <!-- Right Hero Large Frame (x=760..1820, w=1060, h=710, y=140) -->
  <g transform="translate(760, 140)">
    <clipPath id="heroRightClip54">
      <rect width="1060" height="530"/>
    </clipPath>
    <g clip-path="url(#heroRightClip54)">
      <image href="../assets/abstract_placeholder.jpg" x="0" y="0" width="1060" height="530" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <!-- Bottom Technical Plaque -->
    <rect y="530" width="1060" height="180" fill="#141720"/>
    <g transform="translate(40, 560)">
      <rect width="180" height="28" rx="2" fill="#E2F827"/>
      <text x="90" y="19" font-family='monospace' font-size="14" font-weight="900" fill="#111111" text-anchor="middle">● FULL MONOLITH</text>
      <text x="0" y="65" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="800" fill="#ECEEF2">Total Monolithic Surface Composition</text>
      <text x="0" y="95" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#9CA3AF">Macro and micro structural elements unified under strict geometric coordinates.</text>
      <text x="800" y="95" font-family='monospace' font-size="16" font-weight="700" fill="#E2F827" text-anchor="end">STATUS: UNIFIED CORE</text>
    </g>
  </g>
  <!-- Bottom Divider Line (y=880) -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Bottom Running Footer (y=940) -->
  <g transform="translate(100, 940)">
    <text x="0" y="0" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">COCKPIT TELEMETRY // ASYMMETRIC DUAL-DETAIL + HERO MONOLITH</text>
