<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Top Metadata -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">19 / 52 · EVIDENCE REPOSITORY</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">UNBOXED AIRY LEDGER</text>

  <!-- Big Floating Section Headline -->
  <g transform="translate(100, 160)">
    <text x="0" y="45" font-family='system-ui, -apple-system, sans-serif' font-size="48" font-weight="900" fill="#FFFFFF">原声反查账本 // 事实穿透审计底座</text>
    <text x="0" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="400" fill="#8E92A4">不加灰色大外框，仅以 1.5px 极细微线横贯，保留 60% 呼吸空间</text>
  </g>

  <!-- Pure Hairline Ledger Table (No Outer Grey Box Container) -->
  <g transform="translate(100, 300)">
    <!-- Header Row -->
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#252733" stroke-width="1.5"/>
    <text x="0" y="32" font-family='monospace' font-size="18" font-weight="700" fill="#8E92A4">INDEX</text>
    <text x="160" y="32" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#8E92A4">偏见关键词 / 核心感知</text>
    <text x="640" y="32" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#8E92A4">真实原声频次 (样本 N=1,820)</text>
    <text x="1120" y="32" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#8E92A4">战略判定结论</text>
    <text x="1560" y="32" font-family='monospace' font-size="18" font-weight="700" fill="#8E92A4" text-anchor="end">AUDIT STATUS</text>
    <line x1="0" y1="50" x2="1720" y2="50" stroke="#252733" stroke-width="1.5"/>

    <!-- Row 1 -->
    <g transform="translate(0, 60)">
      <text x="0" y="42" font-family='monospace' font-size="24" font-weight="900" fill="#E2F827">#01</text>
      <text x="160" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">“死甜齁嗓子，完全是工业香精”</text>
      <text x="640" y="42" font-family='monospace' font-size="32" font-weight="900" fill="#FFFFFF">842 <tspan font-size="18" fill="#8E92A4" font-family='system-ui'>次提及 (46.3%)</tspan></text>
      <text x="1120" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#E2F827">第一优先破局点：无添加纯咖啡原液</text>
      <rect x="1460" y="18" width="100" height="30" rx="15" fill="#182A1B"/>
      <text x="1510" y="38" font-family='monospace' font-size="18" font-weight="800" fill="#34D399" text-anchor="middle">VERIFIED</text>
      <line x1="0" y1="75" x2="1720" y2="75" stroke="#1F222B" stroke-width="1.5"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 150)">
      <text x="0" y="42" font-family='monospace' font-size="24" font-weight="900" fill="#E2F827">#02</text>
      <text x="160" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">“结块难溶解，喝到最后一口全是渣”</text>
      <text x="640" y="42" font-family='monospace' font-size="32" font-weight="900" fill="#FFFFFF">390 <tspan font-size="18" fill="#8E92A4" font-family='system-ui'>次提及 (21.4%)</tspan></text>
      <text x="1120" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#E2F827">物理感知重构：冷水 3 秒极速融解</text>
      <rect x="1460" y="18" width="100" height="30" rx="15" fill="#182A1B"/>
      <text x="1510" y="38" font-family='monospace' font-size="18" font-weight="800" fill="#34D399" text-anchor="middle">VERIFIED</text>
      <line x1="0" y1="75" x2="1720" y2="75" stroke="#1F222B" stroke-width="1.5"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 240)">
      <text x="0" y="42" font-family='monospace' font-size="24" font-weight="900" fill="#E2F827">#03</text>
      <text x="160" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">“廉价打工人续命水，毫无生活品质”</text>
      <text x="640" y="42" font-family='monospace' font-size="32" font-weight="900" fill="#FFFFFF">280 <tspan font-size="18" fill="#8E92A4" font-family='system-ui'>次提及 (15.4%)</tspan></text>
      <text x="1120" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#E2F827">情绪价值跃迁：精品产区小罐美学</text>
      <rect x="1460" y="18" width="100" height="30" rx="15" fill="#182A1B"/>
      <text x="1510" y="38" font-family='monospace' font-size="18" font-weight="800" fill="#34D399" text-anchor="middle">VERIFIED</text>
      <line x1="0" y1="75" x2="1720" y2="75" stroke="#1F222B" stroke-width="1.5"/>
    </g>

    <!-- Row 4 (Summary Row) -->
    <g transform="translate(0, 330)">
      <text x="0" y="42" font-family='monospace' font-size="24" font-weight="900" fill="#6B7280">TOTAL</text>
      <text x="160" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="700" fill="#8E92A4">全量原声偏见样本覆盖率</text>
      <text x="640" y="42" font-family='monospace' font-size="36" font-weight="900" fill="#E2F827">1,512 <tspan font-size="18" fill="#8E92A4" font-family='system-ui'>条核心高频原声</tspan></text>
      <text x="1120" y="42" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#FFFFFF">已形成绝对决策共识闭环</text>
      <rect x="1460" y="18" width="100" height="30" rx="15" fill="#2E2818"/>
      <text x="1510" y="38" font-family='monospace' font-size="18" font-weight="800" fill="#E2F827" text-anchor="middle">LOCKED</text>
      <line x1="0" y1="75" x2="1720" y2="75" stroke="#252733" stroke-width="2"/>
    </g>
  </g>
</svg>