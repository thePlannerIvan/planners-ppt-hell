    <rect x="580" y="530" width="130" height="130" fill="#E2F827"/>
    <circle cx="645" cy="595" r="45" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="645" y="585" font-family='monospace' font-size="13" font-weight="900" fill="#111111" text-anchor="middle">CERTIFIED</text>
    <text x="645" y="605" font-family='monospace' font-size="13" font-weight="900" fill="#111111" text-anchor="middle">SWISS</text>
    <text x="645" y="625" font-family='monospace' font-size="12" font-weight="700" fill="#111111" text-anchor="middle">2026</text>
  </g>

