    <rect y="180" width="460" height="150" fill="#FFFFFF"/>
    <text x="36" y="225" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">0</text>
    <text x="36" y="265" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="800" fill="#111111">Bento Clutter Tolerated</text>
    <text x="36" y="295" font-family='monospace' font-size="14" font-weight="600" fill="#6B7280">Zero nested cards or bubbly badges</text>

    <!-- Card 3 -->
    <rect y="360" width="460" height="150" fill="#FFFFFF"/>
    <text x="36" y="405" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">100%</text>
    <text x="36" y="445" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="800" fill="#111111">Vector Precision</text>
    <text x="36" y="475" font-family='monospace' font-size="14" font-weight="600" fill="#E2F827">Strict mathematical alignment</text>
  </g>
  <!-- Bottom Divider Line (y=880) -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Bottom Running Footer (y=940) -->
  <g transform="translate(100, 940)">
    <text x="0" y="0" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">COCKPIT TELEMETRY // CENTER MONUMENTAL VISUAL &amp; FLOATING SEAL</text>
    <text x="1720" y="0" font-family='monospace' font-size="16" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER // IVAN</text>
