    <text x="0" y="390" font-family='monospace' font-size="16" font-weight="700" fill="#111111">PRINCIPLE: RADICAL RESTRAINT</text>
  </g>

  <!-- Center Dominant Visual (x=590..1330, w=740, h=690, y=140) -->
  <g transform="translate(590, 140)">
