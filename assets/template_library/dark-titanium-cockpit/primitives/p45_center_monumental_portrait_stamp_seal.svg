    <line x1="1820" y1="930" x2="1820" y2="950"/>
  </g>
  <!-- Top Running Header (y=80) -->
  <text x="140" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">45 / 52 · CENTER MONUMENTAL VISUAL &amp; FLOATING SEAL</text>
  <text x="1780" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">252DF DESIGNER</text>
  <!-- Left Narrative Column (x=100..560, w=460, y=160) -->
  <g transform="translate(100, 160)">
    <text x="0" y="30" font-family='monospace' font-size="18" font-weight="800" fill="#111111">PORTFOLIO // PROFILE</text>
    <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">ARCHITECTURAL</text>
    <text x="0" y="145" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">DIRECTION</text>
    <text x="0" y="210" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">The Swiss Cockpit system was</text>
    <text x="0" y="240" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">created to restore intellectual dignity</text>
    <text x="0" y="270" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">to slide deck presentations.</text>
    <line x1="0" y1="320" x2="420" y2="320" stroke="#CBD5E1" stroke-width="1.5"/>
