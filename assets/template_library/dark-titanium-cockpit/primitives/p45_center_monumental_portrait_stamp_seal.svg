  <g transform="translate(1360, 160)">
    <!-- Card 1 -->
    <rect width="460" height="150" fill="#FFFFFF"/>
    <text x="36" y="45" font-family='system-ui, -apple-system, sans-serif' font-size="44" font-weight="900" fill="#111111">61</text>
