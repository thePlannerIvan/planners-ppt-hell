      <rect width="740" height="690"/>
    </clipPath>
    <g clip-path="url(#portraitClip55)">
      <image href="../assets/abstract_placeholder.jpg" x="0" y="0" width="740" height="690" preserveAspectRatio="xMidYMid slice"/>
    </g>
