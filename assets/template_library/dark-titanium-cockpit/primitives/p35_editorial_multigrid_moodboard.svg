<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">35 / 52 · EDITORIAL MOODBOARD</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">SWISS CURATION GRID</text>

  <!-- Left Narrow Curatorial Column (x=100..420) -->
  <g transform="translate(100, 150)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="900" fill="#111111">// CURATED SIGNALS</text>
    <text x="0" y="85" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111">MOOD</text>
    <text x="0" y="150" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111">BOARD</text>
    <text x="0" y="215" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111">2026</text>

    <text x="0" y="290" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">借由瑞士当代独立刊物的</text>
    <text x="0" y="320" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">非对称多格情绪板结构，</text>
    <text x="0" y="350" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">在一屏内沉浸式释放</text>
    <text x="0" y="380" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#4B5563">全案的质感信条与美学底色。</text>

    <!-- Color Chips Array (Borderless) -->
    <g transform="translate(0, 450)">
      <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#111111">// PALETTE REGISTRY</text>
      <rect x="0" y="35" width="45" height="45" rx="6" fill="#0C0D11"/>
      <rect x="55" y="35" width="45" height="45" rx="6" fill="#FFFFFF"/>
      <rect x="110" y="35" width="45" height="45" rx="6" fill="#CBD5E1"/>
      <rect x="165" y="35" width="45" height="45" rx="6" fill="#283042"/>
      <rect x="220" y="35" width="45" height="45" rx="6" fill="#E2F827"/>
    </g>

    <!-- Meta Pill -->
    <g transform="translate(0, 580)">
      <rect width="280" height="40" rx="20" fill="#111111"/>
      <text x="140" y="25" font-family='monospace' font-size="15" font-weight="800" fill="#E2F827" text-anchor="middle">ISSUE NO. 45 // ARCHIVE</text>
    </g>
  </g>

  <!-- Right Multi-Compartment Editorial Grid (x=460..1820, w=1360, h=690, BORDERLESS TONAL BLOCKS) -->
  <g transform="translate(460, 150)">
    <!-- Slot 1: Hero Dark Void Block (x=0, y=0, w=380, h=390, Borderless) -->
    <g transform="translate(0, 0)">
      <rect width="380" height="390" rx="14" fill="#0C0D11"/>
      <g transform="translate(35, 45)">
        <text x="0" y="25" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827">SIGNAL 01 // TEXTURE</text>
        <text x="0" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="28" font-weight="900" fill="#FFFFFF">OBSIDIAN VOID</text>
        <text x="0" y="115" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#9CA3AF">纯粹无底色的极客驾驶舱底座</text>
        <line x1="0" y1="160" x2="300" y2="160" stroke="#282C3D" stroke-width="1"/>
        <text x="0" y="200" font-family='monospace' font-size="14" font-weight="700" fill="#6B7280">HEX: #0C0D11</text>
        <text x="0" y="230" font-family='monospace' font-size="14" font-weight="700" fill="#6B7280">LIGHT ABSORPTION: 98%</text>
      </g>
    </g>

    <!-- Slot 2: White Architectural Typography Card (x=410, y=0, w=480, h=180, Borderless) -->
    <g transform="translate(410, 0)">
      <rect width="480" height="180" rx="14" fill="#FFFFFF"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#111111">SIGNAL 02 // TYPOGRAPHY</text>
        <text x="0" y="55" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#111111">SWISS MONOSPACE RIGOR</text>
        <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#4B5563">坐标严格锁定于几何基线，杜绝任何杂乱行距。</text>
      </g>
    </g>

    <!-- Slot 3: Hero Fluorescent Lime Accent Card (x=920, y=0, w=440, h=280, Borderless Hero Lime) -->
    <g transform="translate(920, 0)">
      <rect width="440" height="280" rx="14" fill="#E2F827"/>
      <g transform="translate(35, 45)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="900" fill="#111111">SIGNAL 03 // PEAK ACCENT</text>
        <text x="0" y="65" font-family='system-ui, -apple-system, sans-serif' font-size="32" font-weight="900" fill="#111111">LIME ENERGY SIGNAL</text>
        <text x="0" y="110" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#111111">在黑白灰严谨基座上，</text>
        <text x="0" y="140" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#111111">以荧光脉冲确立全屏焦点。</text>
      </g>
    </g>

    <!-- Slot 4: Light Titanium Telemetry Card (x=410, y=210, w=480, h=180, Borderless) -->
    <g transform="translate(410, 210)">
      <rect width="480" height="180" rx="14" fill="#FFFFFF"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#111111">SIGNAL 04 // INSTRUMENTATION</text>
        <text x="0" y="55" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#111111">PRECISION GAUGES &amp; PULSE</text>
        <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#4B5563">让每一个图表具备航空级仪表盘的可读性。</text>
      </g>
    </g>

    <!-- Slot 5: Provenance Barcode Card (x=0, y=420, w=380, h=270, Borderless) -->
    <g transform="translate(0, 420)">
      <rect width="380" height="270" rx="14" fill="#FFFFFF"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#111111">SIGNAL 05 // PROVENANCE</text>
        <text x="0" y="55" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="900" fill="#111111">EVIDENCE ANCHOR</text>
        <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#4B5563">事实核查链条闭环回溯。</text>
        <!-- Barcode Glyphs -->
        <g transform="translate(0, 130)">
          <rect x="0" y="0" width="4" height="40" fill="#111111"/>
          <rect x="8" y="0" width="8" height="40" fill="#111111"/>
          <rect x="20" y="0" width="2" height="40" fill="#111111"/>
          <rect x="26" y="0" width="6" height="40" fill="#111111"/>
          <rect x="36" y="0" width="12" height="40" fill="#111111"/>
          <rect x="52" y="0" width="4" height="40" fill="#111111"/>
          <rect x="60" y="0" width="8" height="40" fill="#111111"/>
          <rect x="72" y="0" width="2" height="40" fill="#111111"/>
          <rect x="80" y="0" width="14" height="40" fill="#111111"/>
          <rect x="98" y="0" width="4" height="40" fill="#111111"/>
          <rect x="106" y="0" width="6" height="40" fill="#111111"/>
          <rect x="116" y="0" width="10" height="40" fill="#111111"/>
          <rect x="130" y="0" width="4" height="40" fill="#111111"/>
          <rect x="138" y="0" width="12" height="40" fill="#111111"/>
          <rect x="154" y="0" width="6" height="40" fill="#111111"/>
          <rect x="164" y="0" width="8" height="40" fill="#111111"/>
          <rect x="176" y="0" width="4" height="40" fill="#111111"/>
        </g>
        <text x="0" y="195" font-family='monospace' font-size="13" font-weight="700" fill="#6B7280">HASH: 94a02d8f7b // AUDITED</text>
      </g>
    </g>

    <!-- Slot 6: Dynamic Vector Card (x=410, y=420, w=480, h=270, Borderless Dark) -->
    <g transform="translate(410, 420)">
      <rect width="480" height="270" rx="14" fill="#0C0D11"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#E2F827">SIGNAL 06 // DYNAMICS</text>
        <text x="0" y="55" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#FFFFFF">NON-LINEAR VECTOR FLOW</text>
        <text x="0" y="90" font-family='system-ui, -apple-system, sans-serif' font-size="16" font-weight="500" fill="#9CA3AF">突破传统幻灯片的流水账结构。</text>
        <!-- Mini Wave Vector -->
        <path d="M 0 160 Q 100 110, 200 160 T 400 160" fill="none" stroke="#E2F827" stroke-width="3"/>
        <circle cx="200" cy="160" r="5" fill="#E2F827"/>
      </g>
    </g>

    <!-- Slot 7: Production Table Spec Card (x=920, y=310, w=440, h=380, Borderless White) -->
    <g transform="translate(920, 310)">
      <rect width="440" height="380" rx="14" fill="#FFFFFF"/>
      <g transform="translate(35, 35)">
        <text x="0" y="20" font-family='monospace' font-size="15" font-weight="800" fill="#111111">SIGNAL 07 // PRODUCTION SPEC</text>
        <text x="0" y="55" font-family='system-ui, -apple-system, sans-serif' font-size="24" font-weight="900" fill="#111111">READY FOR PPTX &amp; SVG</text>

        <line x1="0" y1="85" x2="370" y2="85" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="0" y="115" font-family='monospace' font-size="14" font-weight="800" fill="#111111">DIMENSIONS: 1920 x 1080 (16:9)</text>
        <text x="0" y="145" font-family='monospace' font-size="14" font-weight="800" fill="#111111">COLOR PROFILE: sRGB TITANIUM</text>
        <text x="0" y="175" font-family='monospace' font-size="14" font-weight="800" fill="#111111">LINTER CHECK: 0 ERR / 0 WARN</text>
        <text x="0" y="205" font-family='monospace' font-size="14" font-weight="800" fill="#111111">TOTAL ARTIFACTS: 45 TEMPLATES</text>

        <g transform="translate(0, 245)">
          <rect width="240" height="36" rx="18" fill="#111111"/>
          <text x="120" y="23" font-family='monospace' font-size="14" font-weight="800" fill="#E2F827" text-anchor="middle">CERTIFIED PIPELINE</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">EDITORIAL CURATION GRID // MOODBOARD SIGNALS</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>