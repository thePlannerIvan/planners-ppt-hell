<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">33 / 52 · STRATEGIC FOCUS</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">DECISION APERTURE</text>

  <!-- Left Stage: 4x4 Geometric Matrix (x=100..750) -->
  <g transform="translate(120, 200)">
    <!-- 16 Circles with 1 Highlight -->
    <!-- Row 1 -->
    <circle cx="70" cy="70" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="210" cy="70" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="350" cy="70" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="490" cy="70" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Row 2 (Circle 3 is Highlighted in Electric Lime) -->
    <circle cx="70" cy="210" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="210" cy="210" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="350" cy="210" r="50" fill="#E2F827" stroke="#111111" stroke-width="2.5"/>
    <polygon points="350,192 355,204 368,205 358,214 361,227 350,220 339,227 342,214 332,205 345,204" fill="#111111"/>
    <circle cx="490" cy="210" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Row 3 -->
    <circle cx="70" cy="350" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="210" cy="350" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="350" cy="350" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="490" cy="350" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Row 4 -->
    <circle cx="70" cy="490" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="210" cy="490" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="350" cy="490" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="490" cy="490" r="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Right Stage: Strategic Narrative &amp; Rationale (x=800..1820) -->
  <g transform="translate(800, 200)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">STRATEGY IS SACRIFICE</text>
    <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">战略即取舍与聚集</text>

    <text x="0" y="210" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#374151">在 16 个看似皆可推进的机会点中，</text>
    <text x="0" y="248" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#374151">平庸的团队选择全面撒网，卓越的组织只保留唯一决胜支点。</text>

    <!-- 3 Rationales with Crisp Dividing Hairlines -->
    <g transform="translate(0, 310)">
      <line x1="0" y1="0" x2="980" y2="0" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="0" y="45" font-family='monospace' font-size="18" font-weight="800" fill="#111111">01 / 认知稀缺</text>
      <text x="240" y="45" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#4B5563">用户的注意力只有 3 秒，多一个重点等于没有重点</text>

      <line x1="0" y1="80" x2="980" y2="80" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="0" y="125" font-family='monospace' font-size="18" font-weight="800" fill="#111111">02 / 资源重锤</text>
      <text x="240" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#4B5563">将 80% 的组织弹药倾泻进唯一突破口产生不可逆优势</text>

      <line x1="0" y1="160" x2="980" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="0" y="205" font-family='monospace' font-size="18" font-weight="900" fill="#111111">03 / 决胜单点</text>
      <text x="240" y="205" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="700" fill="#111111">以穿甲级核心功能定义整个品类新标杆</text>
      <line x1="0" y1="240" x2="980" y2="240" stroke="#CBD5E1" stroke-width="1.5"/>
    </g>

    <!-- Capsule Tag -->
    <g transform="translate(0, 580)">
      <rect width="280" height="42" rx="21" fill="#111111"/>
      <text x="140" y="27" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">1 / 16 DETERMINISTIC</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SWISS GEOMETRIC MATRIX // SELECTIVE APERTURE</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>