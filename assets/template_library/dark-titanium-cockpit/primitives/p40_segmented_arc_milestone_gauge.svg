      <text x="0" y="45" font-family='monospace' font-size="88" font-weight="900" fill="#111111" text-anchor="middle">6.0x</text>
      <text x="0" y="95" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#111111" text-anchor="middle">VELOCITY OVER BASELINE</text>

