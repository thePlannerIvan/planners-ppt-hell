      <circle cx="0" cy="0" r="220" fill="none" stroke="#111111" stroke-width="28" stroke-dasharray="245, 1137" stroke-dashoffset="-432"/>
      <circle cx="0" cy="0" r="220" fill="none" stroke="#E2F827" stroke-width="14" stroke-dasharray="245, 1137" stroke-dashoffset="-432"/>

      <!-- Arc 3: Lime #E2F827 (Active) -->
      <circle cx="0" cy="0" r="220" fill="none" stroke="#111111" stroke-width="28" stroke-dasharray="245, 1137" stroke-dashoffset="-692"/>
      <circle cx="0" cy="0" r="220" fill="none" stroke="#E2F827" stroke-width="14" stroke-dasharray="245, 1137" stroke-dashoffset="-692"/>

