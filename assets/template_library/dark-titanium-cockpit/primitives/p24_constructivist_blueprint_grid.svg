<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Construction Scaffolding (Light Coral / Red Hairlines outside text zones) -->
  <g stroke="#EF4444" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.35">
    <line x1="100" y1="160" x2="1820" y2="160"/>
    <line x1="100" y1="720" x2="1820" y2="720"/>
    <line x1="570" y1="160" x2="570" y2="720"/>
    <line x1="0" y1="0" x2="100" y2="160"/>
    <line x1="1820" y1="160" x2="1920" y2="0"/>
    <line x1="0" y1="1080" x2="100" y2="880"/>
    <line x1="1820" y1="880" x2="1920" y2="1080"/>
  </g>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">24 / 33 · CONSTRUCTIVIST BLUEPRINT</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">EXPOSED GRID</text>

  <!-- Left Electric Lime Block (x=100, y=200, w=460, h=440) -->
  <g transform="translate(100, 200)">
    <rect width="460" height="440" fill="#E2F827"/>
    <g transform="translate(45, 55)">
      <text x="0" y="25" font-family='monospace' font-size="16" font-weight="900" fill="#111111">● GRID BASED DESIGN</text>
      <text x="0" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="36" font-weight="900" fill="#111111">暴露结构骨架</text>
      <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="36" font-weight="900" fill="#111111">才是最高级诚实</text>

      <text x="0" y="190" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#111111">将排版对齐辅助线外显，</text>
      <text x="0" y="222" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="600" fill="#111111">传达工业级严苛校准感与秩序美学。</text>

      <line x1="0" y1="280" x2="370" y2="280" stroke="#111111" stroke-width="1.5"/>
      <text x="0" y="325" font-family='monospace' font-size="16" font-weight="900" fill="#111111">TOLERANCE: ±0.00 MM</text>
    </g>
  </g>

  <!-- Right Black Feature Card (x=600, y=280, w=1220, h=360) -->
  <g transform="translate(600, 280)">
    <rect width="1220" height="360" fill="#111111"/>
    <g transform="translate(60, 60)">
      <text x="0" y="40" font-family='monospace' font-size="18" font-weight="900" fill="#E2F827">// TECHNICAL FORUM 2026</text>
      <text x="0" y="110" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#FFFFFF">BEST SPEAKERS &amp; ARCHITECTS</text>

      <text x="0" y="180" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="500" fill="#D1D5DB">汇聚全球顶级策略专家与工程师，探讨认知效率的终极前沿。</text>

      <!-- Micro schedule items -->
      <g transform="translate(0, 230)" font-family='monospace' font-size="16" font-weight="700" fill="#9CA3AF">
        <text x="0" y="0">24 10:45 JAMES WALLBERG // SCALING COGNITION</text>
        <text x="600" y="0">25 14:00 MARK POSTNER // SYSTEM RIGOR</text>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">CONSTRUCTIVIST SCAFFOLDING // MATHEMATICAL HARMONY</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>