<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#ECEEF2"/>

  <!-- Header -->
  <text x="100" y="80" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">18 / 33 · FINANCIAL AUDIT</text>
  <text x="1820" y="80" font-family='monospace' font-size="18" font-weight="700" fill="#111111" text-anchor="end">DENSITY LEDGER</text>

  <!-- Left Density Table (x=100..1050) -->
  <g transform="translate(100, 160)">
    <text x="0" y="30" font-family='monospace' font-size="18" font-weight="900" fill="#111111" letter-spacing="1">OPERATING PERFORMANCE // 8-QUARTER SERIES</text>

    <!-- Table Header Line -->
    <line x1="0" y1="55" x2="920" y2="55" stroke="#111111" stroke-width="2"/>
    <g font-family='monospace' font-size="16" font-weight="800" fill="#4B5563">
      <text x="0" y="85">METRIC ITEM</text>
      <text x="320" y="85">Q1</text>
      <text x="440" y="85">Q2</text>
      <text x="560" y="85">Q3</text>
      <text x="680" y="85">Q4</text>
      <text x="820" y="85">DELTA</text>
    </g>
    <line x1="0" y1="105" x2="920" y2="105" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Rows (8 rows) -->
    <g font-family='monospace' font-size="16" font-weight="700" fill="#111111">
      <!-- R1 -->
      <text x="0" y="145">Core Recurring Revenue</text>
      <text x="320" y="145">12.4M</text><text x="440" y="145">15.8M</text><text x="560" y="145">19.2M</text><text x="680" y="145">24.5M</text>
      <text x="820" y="145" fill="#10B981">+97.5%</text>
      <line x1="0" y1="165" x2="920" y2="165" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R2 -->
      <text x="0" y="200">Gross Margin Efficiency</text>
      <text x="320" y="200">62.0%</text><text x="440" y="200">65.4%</text><text x="560" y="200">68.1%</text><text x="680" y="200">71.8%</text>
      <text x="820" y="200" fill="#10B981">+9.8pp</text>
      <line x1="0" y1="220" x2="920" y2="220" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R3 -->
      <text x="0" y="255">Net Burn Velocity</text>
      <text x="320" y="255">4.2M</text><text x="440" y="255">3.5M</text><text x="560" y="255">2.8M</text><text x="680" y="255">1.4M</text>
      <text x="820" y="255" fill="#10B981">-66.7%</text>
      <line x1="0" y1="275" x2="920" y2="275" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R4 -->
      <text x="0" y="310">Unit LTV / CAC Ratio</text>
      <text x="320" y="310">2.8x</text><text x="440" y="310">3.4x</text><text x="560" y="310">4.1x</text><text x="680" y="310">5.2x</text>
      <text x="820" y="310" fill="#10B981">+85.7%</text>
      <line x1="0" y1="330" x2="920" y2="330" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R5 -->
      <text x="0" y="365">Enterprise Cohort Retention</text>
      <text x="320" y="365">88.4%</text><text x="440" y="365">91.2%</text><text x="560" y="365">94.0%</text><text x="680" y="365">96.8%</text>
      <text x="820" y="365" fill="#10B981">+8.4pp</text>
      <line x1="0" y1="385" x2="920" y2="385" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R6 -->
      <text x="0" y="420">Free Cash Flow Multiple</text>
      <text x="320" y="420">-1.2M</text><text x="440" y="420">+0.8M</text><text x="560" y="420">+3.1M</text><text x="680" y="420">+6.4M</text>
      <text x="820" y="420" fill="#10B981">INF</text>
      <line x1="0" y1="440" x2="920" y2="440" stroke="#E2E8F0" stroke-width="1"/>

      <!-- R7 -->
      <text x="0" y="475">Key Conversion Velocity</text>
      <text x="320" y="475">14.2%</text><text x="440" y="475">18.5%</text><text x="560" y="475">22.8%</text><text x="680" y="475">28.4%</text>
      <text x="820" y="475" fill="#10B981">+14.2pp</text>
      <line x1="0" y1="495" x2="920" y2="495" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Bottom summary row in solid black -->
    <g transform="translate(0, 520)">
      <rect width="920" height="50" fill="#111111"/>
      <text x="20" y="32" font-family='monospace' font-size="16" font-weight="900" fill="#E2F827">TOTAL CAPITAL PRODUCTIVITY SCORE</text>
      <text x="890" y="32" font-family='monospace' font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="end">94.8 / 100</text>
    </g>
  </g>

  <!-- Right Narrative Stage (x=1120..1820) -->
  <g transform="translate(1120, 200)">
    <text x="0" y="60" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">Potential for</text>
    <text x="0" y="125" font-family='system-ui, -apple-system, sans-serif' font-size="52" font-weight="900" fill="#111111" letter-spacing="-1">Exponential Growth</text>

    <text x="0" y="210" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">Good presentation design invites participation.</text>
    <text x="0" y="244" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">It allows the audience to follow along intuitively, creating</text>
    <text x="0" y="278" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">space for connection and understanding. A great</text>
    <text x="0" y="312" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">presentation leaves an impression through precision.</text>

    <text x="0" y="380" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">Every choice—from typography to pacing—plays a role</text>
    <text x="0" y="414" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">in shaping how the audience receives and remembers</text>
    <text x="0" y="448" font-family='system-ui, -apple-system, sans-serif' font-size="20" font-weight="500" fill="#374151">the message. Focus on a single idea for stronger delivery.</text>

    <g transform="translate(0, 520)">
      <rect width="240" height="42" rx="21" fill="#111111"/>
      <text x="120" y="27" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">AUDITED RECORD</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Footer -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SWISS PRECISION // HIGH DENSITY FINANCIAL INTEGRITY</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#111111" text-anchor="end">THE PLANNER SYSTEM</text>
  </g>
</svg>