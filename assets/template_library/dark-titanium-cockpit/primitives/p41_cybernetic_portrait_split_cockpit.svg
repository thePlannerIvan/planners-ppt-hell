    <text x="40" y="230" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#9CA3AF">All telemetry streams processed via zero-copy</text>
    <text x="40" y="258" font-family='system-ui, -apple-system, sans-serif' font-size="18" font-weight="500" fill="#9CA3AF">in-memory execution rings.</text>
    <line x1="40" y1="295" x2="820" y2="295" stroke="#222736" stroke-width="1.5"/>
    <text x="40" y="325" font-family='monospace' font-size="14" font-weight="700" fill="#E2F827">BANDWIDTH: 100 Gbps // PACKET LOSS: 0.00%</text>
  </g>

