    <rect x="40" y="40" width="180" height="28" rx="2" fill="#222736"/>
    <text x="130" y="59" font-family='monospace' font-size="14" font-weight="700" fill="#E2F827" text-anchor="middle">● ANCHOR MATRIX</text>
    <!-- 3 Rows -->
    <g transform="translate(40, 110)">
      <line x1="0" y1="0" x2="780" y2="0" stroke="#282E3E" stroke-width="1"/>
      <text x="0" y="30" font-family='monospace' font-size="18" font-weight="700" fill="#ECEEF2">NODE_01 // TITANIUM MONOLITH</text>
      <text x="780" y="30" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">STATUS: NOMINAL</text>

      <line x1="0" y1="65" x2="780" y2="65" stroke="#282E3E" stroke-width="1"/>
      <text x="0" y="95" font-family='monospace' font-size="18" font-weight="700" fill="#ECEEF2">NODE_02 // VECTOR ACCELERATOR</text>
      <text x="780" y="95" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">LATENCY: 0.8ms</text>

      <line x1="0" y1="130" x2="780" y2="130" stroke="#282E3E" stroke-width="1"/>
      <text x="0" y="160" font-family='monospace' font-size="18" font-weight="700" fill="#ECEEF2">NODE_03 // PARALLEL COMPOSITOR</text>
      <text x="780" y="160" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">FPS: 120.0</text>
    </g>
  </g>
  <!-- Bottom Divider Line (y=880) -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Bottom Running Footer (y=940) -->
  <g transform="translate(100, 940)">
    <text x="0" y="0" font-family='monospace' font-size="16" font-weight="700" fill="#6B7280">COCKPIT TELEMETRY // CYBERNETIC DUAL-COCKPIT HUD SPLIT</text>
    <text x="1720" y="0" font-family='monospace' font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER // IVAN</text>
