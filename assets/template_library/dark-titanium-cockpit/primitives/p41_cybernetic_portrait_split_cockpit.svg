    </clipPath>
    <g clip-path="url(#leftImageClip47)">
      <image href="../assets/abstract_placeholder.jpg" x="0" y="0" width="820" height="720" preserveAspectRatio="xMidYMid slice"/>
      <!-- HUD Reticle Overlay -->
      <g stroke="#E2F827" stroke-width="1.5" fill="none">
        <path d="M 30 50 L 30 30 L 50 30"/>
        <path d="M 790 50 L 790 30 L 770 30"/>
        <path d="M 30 670 L 30 690 L 50 690"/>
        <path d="M 790 670 L 790 690 L 770 690"/>
      </g>
      <!-- HUD Telemetry Badge -->
      <rect x="30" y="650" width="280" height="32" fill="#0C0D11" fill-opacity="0.9"/>
      <text x="45" y="671" font-family='monospace' font-size="13" font-weight="700" fill="#E2F827">TARGET LOCK: LAT 31.23° // MONOLITH</text>
    </g>
  </g>

  <!-- Right Dual-Layer Cockpit Cards (x=960..1820, w=860, y=130) -->
  <!-- Upper Card (h=345) -->
  <g transform="translate(960, 130)">
    <rect width="860" height="345" fill="#141720"/>
    <rect x="40" y="40" width="180" height="28" rx="2" fill="#E2F827"/>
    <text x="130" y="59" font-family='monospace' font-size="14" font-weight="900" fill="#111111" text-anchor="middle">● RADAR TELEMETRY</text>
