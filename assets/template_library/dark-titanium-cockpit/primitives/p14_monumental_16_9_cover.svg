<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0C0D11"/>

  <!-- Subtle 16:9 Grid Scaffolding on Right -->
  <g stroke="#1F2330" stroke-width="1.5">
    <line x1="880" y1="180" x2="1820" y2="180"/>
    <line x1="880" y1="440" x2="1820" y2="440"/>
    <line x1="880" y1="700" x2="1820" y2="700"/>
    <line x1="880" y1="180" x2="880" y2="700"/>
    <line x1="1193" y1="180" x2="1193" y2="700"/>
    <line x1="1506" y1="180" x2="1506" y2="700"/>
    <line x1="1820" y1="180" x2="1820" y2="700"/>
  </g>

  <!-- Giant 16:9 Architectural Wireframe Numeral -->
  <text x="960" y="620" font-family='system-ui, -apple-system, sans-serif' font-size="280" font-weight="900" fill="#181B24" letter-spacing="-8">16:9</text>

  <!-- Running Header -->
  <text x="100" y="100" font-family='monospace' font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">LANDSCAPE RATIO SYSTEM</text>
  <text x="880" y="100" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">FOR HIGH-IMPACT PRESENTATIONS WITH COMMERCIAL FOCUS</text>
  <text x="1820" y="100" font-family='monospace' font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">14 / 33 · BLUEPRINT COVER</text>

  <!-- Left Stage Typographic Hero -->
  <g transform="translate(100, 260)">
    <text x="0" y="70" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#FFFFFF" letter-spacing="-2">HIGHLIGHT</text>
    <text x="0" y="165" font-family='system-ui, -apple-system, sans-serif' font-size="88" font-weight="900" fill="#E2F827" letter-spacing="-2">GRID SYSTEM</text>

    <text x="0" y="260" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="600" fill="#D1D5DB">以严格的数学网格奠定认知重力，</text>
    <text x="0" y="298" font-family='system-ui, -apple-system, sans-serif' font-size="22" font-weight="600" fill="#D1D5DB">用纯粹的排印对比取代廉价卡片装饰。</text>

    <!-- Capsule Tag -->
    <g transform="translate(0, 360)">
      <rect width="260" height="40" rx="20" fill="#1F2330"/>
      <text x="130" y="26" font-family='monospace' font-size="16" font-weight="800" fill="#E2F827" text-anchor="middle">SWISS PROPORTION 1.77:1</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>

  <!-- Footer Micro-Metadata -->
  <g transform="translate(100, 940)">
    <text x="0" y="20" font-family='monospace' font-size="18" font-weight="700" fill="#6B7280">SPEC: 1920 X 1080 PIXELS // MATHEMATICAL MODULARITY</text>
    <text x="1720" y="20" font-family='monospace' font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER ARCHIVE</text>
  </g>
</svg>