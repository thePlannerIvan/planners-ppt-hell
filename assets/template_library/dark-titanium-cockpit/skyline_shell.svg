<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .mono { font-family: monospace; }
    </style>
  </defs>
  
  <rect x="0" y="0" width="1920" height="1080" fill="#0C0D11"/>

  <!-- Four Corner Architectural Cross Markers (+) -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="90" y1="100" x2="110" y2="100"/>
    <line x1="100" y1="90" x2="100" y2="110"/>
    <line x1="1810" y1="100" x2="1830" y2="100"/>
    <line x1="1820" y1="90" x2="1820" y2="110"/>
    <line x1="90" y1="980" x2="110" y2="980"/>
    <line x1="100" y1="970" x2="100" y2="990"/>
    <line x1="1810" y1="980" x2="1830" y2="980"/>
    <line x1="1820" y1="970" x2="1820" y2="990"/>
  </g>

  <!-- Global Skyline Header (y=80..105) -->
  <g id="skyline-header">
    <text x="140" y="105" class="mono" font-size="18" font-weight="700" fill="#9CA3AF" letter-spacing="2">SWISS NEO-BRUTALIST // COCKPIT SYSTEM</text>
    <text x="1780" y="105" class="mono" font-size="18" font-weight="700" fill="#E2F827" text-anchor="end">01 / 13 · SECTION TAXONOMY</text>
  </g>

  <!-- Main Viewport Safe Content Bounds: x=100..1820, y=160..880 -->

  <!-- Global Footer / Metadata Baseline (y=880..960) -->
  <g id="skyline-footer">
    <line x1="100" y1="880" x2="1820" y2="880" stroke="#22252E" stroke-width="1.5"/>
    <text x="100" y="930" class="mono" font-size="18" font-weight="700" fill="#6B7280">COORDINATES: [ 31.2304° N, 121.4737° E ]</text>
    <text x="460" y="930" class="mono" font-size="18" font-weight="700" fill="#6B7280">DESIGN CORE: SWISS TYPOGRAPHY // RADICAL RESTRAINT</text>
    <text x="1820" y="930" class="mono" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="end">THE PLANNER // IVAN</text>
  </g>
</svg>
