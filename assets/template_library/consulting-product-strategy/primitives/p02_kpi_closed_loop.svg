<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="var(--font-sans)">
  <defs>
    <style>
:root {
  /* 75% Neutral Canvas and Surfaces */
  --canvas-bg: #F8FAFC;
  --canvas-pure: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-zebra: #F8FAFC;
  --surface-dark: #0F172A;
  --surface-dark-elevated: #1E293B;
  --surface-accent-tint: #EFF6FF;

  /* 20% Deep Slate Ink Hierarchy */
  --ink-primary: #0F172A;
  --ink-secondary: #475569;
  --ink-muted: #94A3B8;
  --ink-watermark: #E2E8F0;
  --ink-on-dark: #FFFFFF;
  --ink-on-dark-muted: #94A3B8;

  /* 5% Executive Cobalt Blue and Cyan Highlight */
  --accent-brand: #0052D9;
  --accent-secondary: #0284C7;
  --accent-cyan-on-dark: #38BDF8;

  /* Hairlines and Dividers */
  --border-subtle: #E2E8F0;
  --border-strong: #0F172A;

  /* Font Stacks */
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Arial Black", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", "Courier New", monospace;
}

      text { font-family: var(--font-sans); }
      .mono { font-family: var(--font-mono); }
      .display { font-family: var(--font-display); }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="var(--canvas-bg)"/>
  <!-- Consulting Global Skyline Header -->
  <g id="skyline-header">
    <rect x="80" y="64" width="8" height="54" rx="4" fill="var(--accent-brand)"/>
    <text x="106" y="102" font-size="40" font-weight="900" fill="var(--ink-primary)">标杆打法拆解：顶部大盘指标立住量级，三列完成「动作×实证」闭环</text>
    <text x="106" y="144" font-size="20" font-weight="500" fill="var(--ink-secondary)">拒绝空谈方法论，每一列必须同时回答 <tspan fill="var(--accent-brand)" font-weight="700">“具体做了什么动作”与“带来了什么可验证的增长结果”</tspan></text>
    <rect x="1500" y="64" width="340" height="34" rx="6" fill="var(--surface-accent-tint)"/>
    <text x="1670" y="86" class="mono" font-size="14" font-weight="800" fill="var(--accent-brand)" text-anchor="middle" letter-spacing="1">SECTION 01 // BENCHMARK TEARDOWN</text>
    <line x1="80" y1="172" x2="1840" y2="172" stroke="var(--border-subtle)" stroke-width="1.5"/>
  </g>

  <!-- Consulting Global Skyline Bottom Takeaway Banner -->
  <g id="skyline-takeaway">
    <rect x="80" y="918" width="1760" height="76" rx="12" fill="var(--surface-dark)"/>
    <rect x="104" y="937" width="176" height="38" rx="6" fill="var(--accent-brand)"/>
    <text x="192" y="962" class="mono" font-size="14" font-weight="800" fill="var(--ink-on-dark)" text-anchor="middle" letter-spacing="1">BENCHMARK LESSON</text>
    <text x="300" y="964" font-size="22" font-weight="700" fill="var(--ink-on-dark)">核心启示：高客单耐用品的破局不靠泛流量低价冲量，而靠 <tspan fill="var(--accent-cyan-on-dark)" font-weight="900">场景化心智教育 + 高公信力评测背书</tspan> 锁死高净值人群</text>
  </g>

  <!-- Consulting Global Skyline Footer -->
  <g id="skyline-footer">
    <text x="80" y="1034" font-size="14" font-weight="500" fill="var(--ink-muted)">Source: 行业头部标杆品牌近 12 个月投放矩阵与转化归因复盘 (2025.01–2025.12)</text>
    <text x="1840" y="1036" class="display" font-size="20" font-weight="900" fill="var(--ink-primary)" text-anchor="end">02</text>
  </g>
  <!-- Top Full-Width Dark KPI Dashboard Strip (x=80, y=196, w=1760, h=132) -->
  <g id="top-kpi-strip" transform="translate(80, 196)">
    <rect x="0" y="0" width="1760" height="132" rx="14" fill="var(--surface-dark)"/>
    <line x1="440" y1="24" x2="440" y2="108" stroke="#334155" stroke-width="1.5"/>
    <line x1="880" y1="24" x2="880" y2="108" stroke="#334155" stroke-width="1.5"/>
    <line x1="1320" y1="24" x2="1320" y2="108" stroke="#334155" stroke-width="1.5"/>

    <text x="44" y="42" class="mono" font-size="14" font-weight="700" fill="var(--ink-on-dark-muted)">ANNUAL SOV // 赛道声量占有率</text>
    <text x="44" y="102" class="display" font-size="52" font-weight="900" fill="var(--ink-on-dark)">34.8<tspan font-size="24" fill="var(--accent-cyan-on-dark)">%</tspan></text>
    <text x="235" y="96" font-size="16" font-weight="600" fill="var(--accent-cyan-on-dark)">同比 +14.2pct</text>

    <text x="484" y="42" class="mono" font-size="14" font-weight="700" fill="var(--ink-on-dark-muted)">SEARCH SHARE // 决策词首屏卡位率</text>
    <text x="484" y="102" class="display" font-size="52" font-weight="900" fill="var(--accent-cyan-on-dark)">62.0<tspan font-size="24" fill="var(--ink-on-dark)">%</tspan></text>
    <text x="675" y="96" font-size="16" font-weight="600" fill="var(--ink-on-dark-muted)">垄断前 3 热搜位</text>

    <text x="924" y="42" class="mono" font-size="14" font-weight="700" fill="var(--ink-on-dark-muted)">ENGAGEMENT // 深度长文平均收藏率</text>
    <text x="924" y="102" class="display" font-size="52" font-weight="900" fill="var(--ink-on-dark)">41.5<tspan font-size="24" fill="var(--accent-cyan-on-dark)">%</tspan></text>
    <text x="1115" y="96" font-size="16" font-weight="600" fill="var(--ink-on-dark-muted)">行业均值 2.4 倍</text>

    <text x="1364" y="42" class="mono" font-size="14" font-weight="700" fill="var(--ink-on-dark-muted)">PRICE PREMIUM // 主力成交客单溢价</text>
    <text x="1364" y="102" class="display" font-size="52" font-weight="900" fill="var(--ink-on-dark)">+38<tspan font-size="24" fill="var(--accent-cyan-on-dark)">%</tspan></text>
    <text x="1535" y="96" font-size="16" font-weight="600" fill="var(--accent-cyan-on-dark)">跳出低价促销战</text>
  </g>

  <!-- 3-Column Action x Evidence Closed-Loop Cards (y=354, h=538, w=564, gap=34) -->
  <!-- Column 1 -->
  <g id="closed-loop-col-1" transform="translate(80, 354)">
    <rect x="0" y="0" width="564" height="538" rx="14" fill="var(--surface-card)"/>
    <rect x="0" y="0" width="564" height="8" rx="4" fill="var(--accent-brand)"/>
    <rect x="32" y="30" width="128" height="32" rx="6" fill="var(--surface-accent-tint)"/>
    <text x="96" y="51" class="mono" font-size="14" font-weight="800" fill="var(--accent-brand)" text-anchor="middle">PILLAR 01</text>
    <text x="32" y="102" font-size="26" font-weight="900" fill="var(--ink-primary)">重构痛点认知：从「讲参数」到「讲体感」</text>
    <text x="32" y="146" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 放弃枯燥的工业级过滤孔径术语，切入「晨起第一杯温矿水」</text>
    <text x="32" y="176" font-size="18" font-weight="500" fill="var(--ink-secondary)">  与「母婴冲奶零等待」三大高频生活切面；</text>
    <text x="32" y="216" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 建立可视化的「好水标准」对比实验，降低大众理解门槛。</text>

    <!-- Bottom Evidence Sub-box (Eliminates dead card bottom space!) -->
    <rect x="24" y="268" width="516" height="244" rx="12" fill="var(--surface-accent-tint)"/>
    <rect x="24" y="268" width="6" height="244" rx="3" fill="var(--accent-brand)"/>
    <text x="48" y="306" class="mono" font-size="13" font-weight="800" fill="var(--accent-brand)">EMPIRICAL PROOF // 爆文与转化实证</text>
    <text x="48" y="344" font-size="20" font-weight="800" fill="var(--ink-primary)">《把水当成第一支护肤品》系列种草笔记</text>
    <text x="48" y="382" font-size="17" font-weight="500" fill="var(--ink-secondary)">单篇自然互动破 1.8w，带动「富含矿物质净水器」</text>
    <text x="48" y="410" font-size="17" font-weight="500" fill="var(--ink-secondary)">品类搜索词月环比暴涨 <tspan fill="var(--accent-brand)" font-weight="800">+310%</tspan>，女性新客占比达 74%。</text>
    <rect x="48" y="440" width="210" height="38" rx="8" fill="var(--surface-card)"/>
    <text x="153" y="465" class="mono" font-size="15" font-weight="800" fill="var(--accent-brand)" text-anchor="middle">单篇 ROI 达 4.1</text>
  </g>

  <!-- Column 2 -->
  <g id="closed-loop-col-2" transform="translate(678, 354)">
    <rect x="0" y="0" width="564" height="538" rx="14" fill="var(--surface-card)"/>
    <rect x="0" y="0" width="564" height="8" rx="4" fill="var(--surface-dark)"/>
    <rect x="32" y="30" width="128" height="32" rx="6" fill="var(--surface-muted)"/>
    <text x="96" y="51" class="mono" font-size="14" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">PILLAR 02</text>
    <text x="32" y="102" font-size="26" font-weight="900" fill="var(--ink-primary)">中坚达人打透：重金投入腰部专家证言</text>
    <text x="32" y="146" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 砍掉低转化泛娱乐头部达人，将 65% 预算集中投向</text>
    <text x="32" y="176" font-size="18" font-weight="500" fill="var(--ink-secondary)">  家电拆机党、营养师、精致妈妈三类高信任度垂类腰部；</text>
    <text x="32" y="216" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 统一配发 TDS/pH 实测道具包，输出硬核长图文横评。</text>

    <rect x="24" y="268" width="516" height="244" rx="12" fill="var(--surface-muted)"/>
    <rect x="24" y="268" width="6" height="244" rx="3" fill="var(--surface-dark)"/>
    <text x="48" y="306" class="mono" font-size="13" font-weight="800" fill="var(--ink-primary)">EMPIRICAL PROOF // 达人矩阵效率实证</text>
    <text x="48" y="344" font-size="20" font-weight="800" fill="var(--ink-primary)">30 位垂类专家《万元级净水横评红宝书》</text>
    <text x="48" y="382" font-size="17" font-weight="500" fill="var(--ink-secondary)">平均单篇收藏率高达 <tspan fill="var(--ink-primary)" font-weight="800">46.2%</tspan>，长尾搜索生命周期</text>
    <text x="48" y="410" font-size="17" font-weight="500" fill="var(--ink-secondary)">长达 180 天，持续霸榜「净水器怎么选」首屏前五。</text>
    <rect x="48" y="440" width="230" height="38" rx="8" fill="var(--surface-card)"/>
    <text x="163" y="465" class="mono" font-size="15" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">获客成本降低 -38%</text>
  </g>

  <!-- Column 3 -->
  <g id="closed-loop-col-3" transform="translate(1276, 354)">
    <rect x="0" y="0" width="564" height="538" rx="14" fill="var(--surface-card)"/>
    <rect x="0" y="0" width="564" height="8" rx="4" fill="var(--surface-dark)"/>
    <rect x="32" y="30" width="128" height="32" rx="6" fill="var(--surface-muted)"/>
    <text x="96" y="51" class="mono" font-size="14" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">PILLAR 03</text>
    <text x="32" y="102" font-size="26" font-weight="900" fill="var(--ink-primary)">搜索词全包揽：防守品牌词 + 截流竞品词</text>
    <text x="32" y="146" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 针对进入比价阶段的准买家，围绕「换芯成本」「噪音实测」</text>
    <text x="32" y="176" font-size="18" font-weight="500" fill="var(--ink-secondary)">  「售后安装」铺设 100+ 篇真实入户体验笔记；</text>
    <text x="32" y="216" font-size="18" font-weight="500" fill="var(--ink-secondary)">• 评论区置顶全周期换芯账单，彻底打消下单前最后一公里顾虑。</text>

    <rect x="24" y="268" width="516" height="244" rx="12" fill="var(--surface-muted)"/>
    <rect x="24" y="268" width="6" height="244" rx="3" fill="var(--surface-dark)"/>
    <text x="48" y="306" class="mono" font-size="13" font-weight="800" fill="var(--ink-primary)">EMPIRICAL PROOF // 漏斗收口实证</text>
    <text x="48" y="344" font-size="20" font-weight="800" fill="var(--ink-primary)">搜索防守矩阵 + 蓝 V 店铺组件直连</text>
    <text x="48" y="382" font-size="17" font-weight="500" fill="var(--ink-secondary)">品牌词回搜流失率从 39% 降至 <tspan fill="var(--ink-primary)" font-weight="800">12%</tspan>，京东/天猫旗舰店</text>
    <text x="48" y="410" font-size="17" font-weight="500" fill="var(--ink-secondary)">自然进店转化率提升 2.1 倍，实现种草即拔草闭环。</text>
    <rect x="48" y="440" width="230" height="38" rx="8" fill="var(--surface-card)"/>
    <text x="163" y="465" class="mono" font-size="15" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">回搜转化率 +115%</text>
  </g>
</svg>
