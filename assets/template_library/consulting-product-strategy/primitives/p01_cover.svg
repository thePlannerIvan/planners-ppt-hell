<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="var(--font-sans)">
  <defs>
    <style>
:root {
  /* 75% Neutral Canvas and Surfaces */
  --canvas-bg: #F8FAFC;
  --canvas-pure: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-zebra: #F8FAFC;
  --surface-dark: #0F172A;
  --surface-dark-elevated: #1E293B;
  --surface-accent-tint: #EFF6FF;

  /* 20% Deep Slate Ink Hierarchy */
  --ink-primary: #0F172A;
  --ink-secondary: #475569;
  --ink-muted: #94A3B8;
  --ink-watermark: #E2E8F0;
  --ink-on-dark: #FFFFFF;
  --ink-on-dark-muted: #94A3B8;

  /* 5% Executive Cobalt Blue and Cyan Highlight */
  --accent-brand: #0052D9;
  --accent-secondary: #0284C7;
  --accent-cyan-on-dark: #38BDF8;

  /* Hairlines and Dividers */
  --border-subtle: #E2E8F0;
  --border-strong: #0F172A;

  /* Font Stacks */
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Arial Black", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", "Courier New", monospace;
}

      text { font-family: var(--font-sans); }
      .mono { font-family: var(--font-mono); }
      .display { font-family: var(--font-display); }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="var(--surface-dark)"/>
  <!-- Full-Bleed Deep Slate Navy Canvas -->
  <rect x="0" y="0" width="1920" height="1080" fill="var(--surface-dark)"/>

  <!-- Architectural Blueprint Lines & Right Geometric Accent Panel -->
  <rect x="1340" y="0" width="580" height="1080" fill="var(--surface-dark-elevated)"/>
  <rect x="1340" y="0" width="10" height="1080" fill="var(--accent-brand)"/>
  <line x1="120" y1="140" x2="1800" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="840" x2="1800" y2="840" stroke="#334155" stroke-width="1"/>

  <!-- Top Classification Badge -->
  <rect x="120" y="64" width="240" height="38" rx="6" fill="var(--accent-brand)"/>
  <text x="240" y="89" class="mono" font-size="15" font-weight="800" fill="var(--ink-on-dark)" text-anchor="middle" letter-spacing="2">STRATEGIC REPORT</text>
  <text x="384" y="89" class="mono" font-size="15" font-weight="600" fill="var(--ink-on-dark-muted)" letter-spacing="2">CATEGORY BREAKTHROUGH &amp; PRODUCT POSITIONING</text>

  <!-- Main Executive Thesis Title -->
  <rect x="120" y="260" width="12" height="196" rx="4" fill="var(--accent-cyan-on-dark)"/>
  <text x="160" y="328" font-size="62" font-weight="900" fill="var(--ink-on-dark)">跳出「参数内卷」泥潭：</text>
  <text x="160" y="418" font-size="62" font-weight="900" fill="var(--ink-on-dark)">以<tspan fill="var(--accent-cyan-on-dark)">场景化生活方案</tspan>重构高溢价增长曲线</text>

  <text x="160" y="510" font-size="25" font-weight="500" fill="var(--ink-on-dark-muted)">2026 品类竞争格局拆解、目标蓝海象限锁定与产品组合商业化推演</text>

  <!-- Right Panel: 3 Quantified Executive Highlights -->
  <text x="1400" y="220" class="mono" font-size="15" font-weight="800" fill="var(--accent-cyan-on-dark)" letter-spacing="2">KEY FINDINGS AT A GLANCE</text>

  <g transform="translate(1400, 260)">
    <rect x="0" y="0" width="440" height="156" rx="12" fill="var(--surface-dark)"/>
    <text x="28" y="46" class="mono" font-size="13" font-weight="700" fill="var(--ink-on-dark-muted)">01 // DEMAND SHIFT</text>
    <text x="28" y="102" class="display" font-size="48" font-weight="900" fill="var(--accent-cyan-on-dark)">+214%</text>
    <text x="200" y="86" font-size="18" font-weight="700" fill="var(--ink-on-dark)">感性体验词搜索增速</text>
    <text x="200" y="114" font-size="15" font-weight="500" fill="var(--ink-on-dark-muted)">远超纯硬件参数词 (+18%)</text>
  </g>

  <g transform="translate(1400, 446)">
    <rect x="0" y="0" width="440" height="156" rx="12" fill="var(--surface-dark)"/>
    <text x="28" y="46" class="mono" font-size="13" font-weight="700" fill="var(--ink-on-dark-muted)">02 // BLUE OCEAN VACANCY</text>
    <text x="28" y="102" class="display" font-size="48" font-weight="900" fill="var(--ink-on-dark)">68.5%</text>
    <text x="200" y="86" font-size="18" font-weight="700" fill="var(--ink-on-dark)">高净值新中产未满足率</text>
    <text x="200" y="114" font-size="15" font-weight="500" fill="var(--ink-on-dark-muted)">「专精技术 × 审美悦己」象限空缺</text>
  </g>

  <g transform="translate(1400, 632)">
    <rect x="0" y="0" width="440" height="156" rx="12" fill="var(--surface-dark)"/>
    <text x="28" y="46" class="mono" font-size="13" font-weight="700" fill="var(--ink-on-dark-muted)">03 // TARGET ROI LIFT</text>
    <text x="28" y="102" class="display" font-size="48" font-weight="900" fill="var(--accent-cyan-on-dark)">2.8x</text>
    <text x="200" y="86" font-size="18" font-weight="700" fill="var(--ink-on-dark)">双品组合连带转化率</text>
    <text x="200" y="114" font-size="15" font-weight="500" fill="var(--ink-on-dark-muted)">反漏斗高浓度种子人群打法</text>
  </g>

  <!-- Bottom 3-Column Metadata Footer -->
  <text x="120" y="905" class="mono" font-size="14" font-weight="700" fill="var(--accent-cyan-on-dark)">METHODOLOGY</text>
  <text x="120" y="942" font-size="19" font-weight="700" fill="var(--ink-on-dark)">搜索词云定量拆解 × 竞品象限映射 × 转化漏斗建模</text>

  <text x="720" y="905" class="mono" font-size="14" font-weight="700" fill="var(--accent-cyan-on-dark)">DECISION HORIZON</text>
  <text x="720" y="942" font-size="19" font-weight="700" fill="var(--ink-on-dark)">2026 Q2–Q4 产品定位与商业化投放全案</text>
</svg>
