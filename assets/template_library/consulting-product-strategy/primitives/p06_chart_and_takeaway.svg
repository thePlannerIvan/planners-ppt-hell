<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="var(--font-sans)">
  <defs>
    <style>
:root {
  /* 75% Neutral Canvas and Surfaces */
  --canvas-bg: #F8FAFC;
  --canvas-pure: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-zebra: #F8FAFC;
  --surface-dark: #0F172A;
  --surface-dark-elevated: #1E293B;
  --surface-accent-tint: #EFF6FF;

  /* 20% Deep Slate Ink Hierarchy */
  --ink-primary: #0F172A;
  --ink-secondary: #475569;
  --ink-muted: #94A3B8;
  --ink-watermark: #E2E8F0;
  --ink-on-dark: #FFFFFF;
  --ink-on-dark-muted: #94A3B8;

  /* 5% Executive Cobalt Blue and Cyan Highlight */
  --accent-brand: #0052D9;
  --accent-secondary: #0284C7;
  --accent-cyan-on-dark: #38BDF8;

  /* Hairlines and Dividers */
  --border-subtle: #E2E8F0;
  --border-strong: #0F172A;

  /* Font Stacks */
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Arial Black", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", "Courier New", monospace;
}

      text { font-family: var(--font-sans); }
      .mono { font-family: var(--font-mono); }
      .display { font-family: var(--font-display); }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="var(--canvas-bg)"/>
  <!-- Consulting Global Skyline Header -->
  <g id="skyline-header">
    <rect x="80" y="64" width="8" height="54" rx="4" fill="var(--accent-brand)"/>
    <text x="106" y="102" font-size="40" font-weight="900" fill="var(--ink-primary)">增长曲线验证：新范式驱动核心决策词搜索量与高客单转化率双线跃升</text>
    <text x="106" y="144" font-size="20" font-weight="500" fill="var(--ink-secondary)">对比传统泛流量投放基准线，<tspan fill="var(--accent-brand)" font-weight="700">反漏斗场景种草模型</tspan> 在 618 与双 11 两大节点实现超额脉冲爆发</text>
    <rect x="1500" y="64" width="340" height="34" rx="6" fill="var(--surface-accent-tint)"/>
    <text x="1670" y="86" class="mono" font-size="14" font-weight="800" fill="var(--accent-brand)" text-anchor="middle" letter-spacing="1">SECTION 04 // QUANTIFIED FORECAST</text>
    <line x1="80" y1="172" x2="1840" y2="172" stroke="var(--border-subtle)" stroke-width="1.5"/>
  </g>

  <!-- Consulting Global Skyline Bottom Takeaway Banner -->
  <g id="skyline-takeaway">
    <rect x="80" y="918" width="1760" height="76" rx="12" fill="var(--surface-dark)"/>
    <rect x="104" y="937" width="176" height="38" rx="6" fill="var(--accent-brand)"/>
    <text x="192" y="962" class="mono" font-size="14" font-weight="800" fill="var(--ink-on-dark)" text-anchor="middle" letter-spacing="1">INVESTMENT ROI</text>
    <text x="300" y="964" font-size="22" font-weight="700" fill="var(--ink-on-dark)">财务底线承诺：全年综合种草获客成本下降 <tspan fill="var(--accent-cyan-on-dark)" font-weight="900">-32%</tspan>，高端主力机型全周期 ROI 稳定在 3.5 以上</text>
  </g>

  <!-- Consulting Global Skyline Footer -->
  <g id="skyline-footer">
    <text x="80" y="1034" font-size="14" font-weight="500" fill="var(--ink-muted)">Source: 历史投放弹性系数回归模型与 2026 全年分阶段销量测算</text>
    <text x="1840" y="1036" class="display" font-size="20" font-weight="900" fill="var(--ink-primary)" text-anchor="end">06</text>
  </g>
  <!-- Left 2/3 Chart Panel (x=80, y=196, w=1140, h=696) -->
  <g id="chart-panel">
    <rect x="80" y="196" width="1140" height="696" rx="16" fill="var(--surface-card)"/>

    <text x="128" y="252" font-size="24" font-weight="900" fill="var(--ink-primary)">分阶段品牌主搜指数与高意向进店量对比（指数化：基准期=100）</text>
    <!-- Legend -->
    <rect x="820" y="230" width="20" height="20" rx="4" fill="#CBD5E1"/>
    <text x="848" y="247" font-size="15" font-weight="600" fill="var(--ink-secondary)">传统参数投放基准</text>
    <rect x="1008" y="230" width="20" height="20" rx="4" fill="var(--accent-brand)"/>
    <text x="1036" y="247" font-size="15" font-weight="800" fill="var(--accent-brand)">新范式场景种草预测</text>

    <!-- Horizontal Grid Lines -->
    <line x1="128" y1="330" x2="1170" y2="330" stroke="var(--border-subtle)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="128" y1="430" x2="1170" y2="430" stroke="var(--border-subtle)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="128" y1="530" x2="1170" y2="530" stroke="var(--border-subtle)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="128" y1="630" x2="1170" y2="630" stroke="var(--border-subtle)" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="128" y1="730" x2="1170" y2="730" stroke="var(--ink-primary)" stroke-width="2"/>

    <!-- Target Threshold Line -->
    <line x1="128" y1="466" x2="1170" y2="466" stroke="var(--accent-secondary)" stroke-width="2" stroke-dasharray="8,6"/>
    <rect x="136" y="446" width="216" height="28" rx="6" fill="var(--surface-accent-tint)"/>
    <text x="244" y="465" class="mono" font-size="13" font-weight="800" fill="var(--accent-brand)" text-anchor="middle">盈亏平衡安全线 (INDEX=120)</text>
    <!-- Bar Group 1: Q1 蓄水期 -->
    <g id="chart-bar-1">
      <rect x="160" y="638" width="44" height="92" rx="6" fill="#CBD5E1"/>
      <text x="182" y="626" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">42</text>

      <rect x="212" y="581" width="44" height="149" rx="6" fill="var(--accent-brand)"/>
      <text x="234" y="569" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">68</text>

      <text x="208" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">Q1 蓄水期</text>
    </g>
    <!-- Bar Group 2: Q2 破圈期 -->
    <g id="chart-bar-2">
      <rect x="330" y="625" width="44" height="105" rx="6" fill="#CBD5E1"/>
      <text x="352" y="613" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">48</text>

      <rect x="382" y="440" width="44" height="290" rx="6" fill="var(--accent-brand)"/>
      <text x="404" y="428" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">132</text>

      <text x="378" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">Q2 破圈期</text>
    </g>
    <!-- Bar Group 3: 618 爆发期 -->
    <g id="chart-bar-3">
      <rect x="500" y="587" width="44" height="143" rx="6" fill="#CBD5E1"/>
      <text x="522" y="575" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">65</text>

      <rect x="552" y="361" width="44" height="369" rx="6" fill="var(--accent-brand)"/>
      <text x="574" y="349" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">168</text>

      <text x="548" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">618 爆发期</text>
    </g>
    <!-- Bar Group 4: Q3 续航期 -->
    <g id="chart-bar-4">
      <rect x="670" y="616" width="44" height="114" rx="6" fill="#CBD5E1"/>
      <text x="692" y="604" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">52</text>

      <rect x="722" y="427" width="44" height="303" rx="6" fill="var(--accent-brand)"/>
      <text x="744" y="415" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">138</text>

      <text x="718" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">Q3 续航期</text>
    </g>
    <!-- Bar Group 5: Q4 种草期 -->
    <g id="chart-bar-5">
      <rect x="840" y="603" width="44" height="127" rx="6" fill="#CBD5E1"/>
      <text x="862" y="591" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">58</text>

      <rect x="892" y="392" width="44" height="338" rx="6" fill="var(--accent-brand)"/>
      <text x="914" y="380" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">154</text>

      <text x="888" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">Q4 种草期</text>
    </g>
    <!-- Bar Group 6: 双11 决战期 -->
    <g id="chart-bar-6">
      <rect x="1010" y="568" width="44" height="162" rx="6" fill="#CBD5E1"/>
      <text x="1032" y="556" class="mono" font-size="14" font-weight="700" fill="var(--ink-secondary)" text-anchor="middle">74</text>

      <rect x="1062" y="299" width="44" height="431" rx="6" fill="var(--accent-brand)"/>
      <text x="1084" y="287" class="mono" font-size="15" font-weight="900" fill="var(--accent-brand)" text-anchor="middle">196</text>

      <text x="1058" y="772" font-size="16" font-weight="700" fill="var(--ink-primary)" text-anchor="middle">双11 决战期</text>
    </g>
    <text x="128" y="842" font-size="16" font-weight="600" fill="var(--ink-secondary)">注：Q2 破圈期完成前 30 位垂类专家红宝书铺设后，长尾搜索资产在 618 与双 11 产生显著复利效应。</text>
  </g>

  <!-- Right 1/3 Structured Insights Column (x=1252, y=196, w=588, h=696) -->
  <g id="chart-insights-panel" transform="translate(1252, 196)">
    <!-- Insight Card 1 -->
    <rect x="0" y="0" width="588" height="216" rx="14" fill="var(--surface-card)"/>
    <rect x="0" y="0" width="8" height="216" rx="4" fill="var(--accent-brand)"/>
    <text x="36" y="46" class="mono" font-size="14" font-weight="800" fill="var(--accent-brand)">DRIVER 01 // 蓄水期复利效应</text>
    <text x="36" y="90" font-size="24" font-weight="900" fill="var(--ink-primary)">提前 45 天种草，大促搜索溢价翻倍</text>
    <text x="36" y="132" font-size="17" font-weight="500" fill="var(--ink-secondary)">高客单耐用品平均决策周期达 21–35 天。Q2 提前铺设</text>
    <text x="36" y="162" font-size="17" font-weight="500" fill="var(--ink-secondary)">横评与入户实测，使 618 期间自然回搜率提升 <tspan fill="var(--accent-brand)" font-weight="800">+158%</tspan>。</text>

    <!-- Insight Card 2 -->
    <rect x="0" y="240" width="588" height="216" rx="14" fill="var(--surface-card)"/>
    <rect x="0" y="240" width="8" height="216" rx="4" fill="var(--surface-dark)"/>
    <text x="36" y="286" class="mono" font-size="14" font-weight="800" fill="var(--ink-primary)">DRIVER 02 // 双品连带杠杆</text>
    <text x="36" y="330" font-size="24" font-weight="900" fill="var(--ink-primary)">主厨矿泉机 + 美容软水机组合套购</text>
    <text x="36" y="372" font-size="17" font-weight="500" fill="var(--ink-secondary)">用「洗脸护肤软水」切入女性心智后，通过全屋用水</text>
    <text x="36" y="402" font-size="17" font-weight="500" fill="var(--ink-secondary)">方案包带动套系连带购买率从 9% 跃升至 <tspan fill="var(--ink-primary)" font-weight="800">25.4%</tspan>。</text>

    <!-- Insight Card 3 -->
    <rect x="0" y="480" width="588" height="216" rx="14" fill="var(--surface-dark)"/>
    <rect x="0" y="480" width="8" height="216" rx="4" fill="var(--accent-cyan-on-dark)"/>
    <text x="36" y="526" class="mono" font-size="14" font-weight="800" fill="var(--accent-cyan-on-dark)">DRIVER 03 // 预算动态止损机制</text>
    <text x="36" y="570" font-size="24" font-weight="900" fill="var(--ink-on-dark)">赛马投流：只追投前 20% 高收藏笔记</text>
    <text x="36" y="612" font-size="17" font-weight="400" fill="var(--ink-on-dark-muted)">自然流量测试池满 48 小时后，自动关停互动率低于</text>
    <text x="36" y="642" font-size="17" font-weight="400" fill="var(--ink-on-dark-muted)">均值笔记，将 80% 聚光预算集中灌注给高转化黑马帖。</text>
  </g>
</svg>
