<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="var(--font-sans)">
  <defs>
    <style>
:root {
  /* 75% Neutral Canvas and Surfaces */
  --canvas-bg: #F8FAFC;
  --canvas-pure: #FFFFFF;
  --surface-card: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-zebra: #F8FAFC;
  --surface-dark: #0F172A;
  --surface-dark-elevated: #1E293B;
  --surface-accent-tint: #EFF6FF;

  /* 20% Deep Slate Ink Hierarchy */
  --ink-primary: #0F172A;
  --ink-secondary: #475569;
  --ink-muted: #94A3B8;
  --ink-watermark: #E2E8F0;
  --ink-on-dark: #FFFFFF;
  --ink-on-dark-muted: #94A3B8;

  /* 5% Executive Cobalt Blue and Cyan Highlight */
  --accent-brand: #0052D9;
  --accent-secondary: #0284C7;
  --accent-cyan-on-dark: #38BDF8;

  /* Hairlines and Dividers */
  --border-subtle: #E2E8F0;
  --border-strong: #0F172A;

  /* Font Stacks */
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Arial Black", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", "Courier New", monospace;
}

      text { font-family: var(--font-sans); }
      .mono { font-family: var(--font-mono); }
      .display { font-family: var(--font-display); }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="var(--canvas-bg)"/>
  <!-- Consulting Global Skyline Header -->
  <g id="skyline-header">
    <rect x="80" y="64" width="8" height="54" rx="4" fill="var(--accent-brand)"/>
    <text x="106" y="102" font-size="40" font-weight="900" fill="var(--ink-primary)">商业结论型标题（Action Title）：先给因果判断，拒绝「行业分析」式空洞标签</text>
    <text x="106" y="144" font-size="20" font-weight="500" fill="var(--ink-secondary)">副标题交代数据时间窗与比较基准，关键增量指标用 <tspan fill="var(--accent-brand)" font-weight="700">克莱因钴蓝高亮锚定</tspan>，确保一秒抓住核心矛盾</text>
    <rect x="1500" y="64" width="340" height="34" rx="6" fill="var(--surface-accent-tint)"/>
    <text x="1670" y="86" class="mono" font-size="14" font-weight="800" fill="var(--accent-brand)" text-anchor="middle" letter-spacing="1">EXECUTIVE REPORT // 01</text>
    <line x1="80" y1="172" x2="1840" y2="172" stroke="var(--border-subtle)" stroke-width="1.5"/>
  </g>

  <!-- Consulting Global Skyline Bottom Takeaway Banner -->
  <g id="skyline-takeaway">
    <rect x="80" y="918" width="1760" height="76" rx="12" fill="var(--surface-dark)"/>
    <rect x="104" y="937" width="176" height="38" rx="6" fill="var(--accent-brand)"/>
    <text x="192" y="962" class="mono" font-size="14" font-weight="800" fill="var(--ink-on-dark)" text-anchor="middle" letter-spacing="1">STRATEGIC VERDICT</text>
    <text x="300" y="964" font-size="22" font-weight="700" fill="var(--ink-on-dark)">战略收口横幅：将上方的数据图表与竞争矩阵收敛为 <tspan fill="var(--accent-cyan-on-dark)" font-weight="900">唯一可执行的产品与渠道取舍决策</tspan></text>
  </g>

  <!-- Consulting Global Skyline Footer -->
  <g id="skyline-footer">
    <text x="80" y="1034" font-size="14" font-weight="500" fill="var(--ink-muted)">Source: 案头研究、消费者定量问卷 (N=2,400) 与电商平台品类交易大盘数据</text>
    <text x="1840" y="1036" class="display" font-size="20" font-weight="900" fill="var(--ink-primary)" text-anchor="end">01</text>
  </g>
  <!-- Safe Content Zone Guide (x=80..1840, y=196..896) -->
  <g id="content-safe-zone" opacity="0.85">
    <rect x="80" y="196" width="1760" height="700" rx="16" fill="var(--surface-card)" stroke="var(--border-subtle)" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="960" y="530" font-size="28" font-weight="800" fill="var(--ink-muted)" text-anchor="middle">CONSULTING SAFE ZONE (x: 80..1840, y: 196..896, 1760×700px)</text>
    <text x="960" y="574" font-size="18" font-weight="500" fill="var(--ink-muted)" text-anchor="middle">适用：KPI 闭环验证 · 2×2 战略象限 · 痛点传导机制 · 攻防范式对比 · 复合图表</text>
  </g>
</svg>
