    <rect x="28" y="318" width="164" height="34" rx="6" fill="var(--surface-muted)"/>
    <text x="110" y="341" class="mono" font-size="15" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">资源配比：10%</text>

