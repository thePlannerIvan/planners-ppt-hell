    <line x1="28" y1="228" x2="388" y2="228" stroke="var(--border-subtle)" stroke-width="1.5"/>

    <!-- Section B: Hero Product & Budget Share -->
    <text x="28" y="262" class="mono" font-size="13" font-weight="800" fill="var(--ink-muted)">02 // HERO SKU &amp; RESOURCE SHARE</text>
    <text x="28" y="298" font-size="20" font-weight="800" fill="var(--ink-primary)">竞速碳板跑鞋 / 专业球靴</text>
    <rect x="28" y="318" width="164" height="34" rx="6" fill="var(--surface-muted)"/>
    <text x="110" y="341" class="mono" font-size="15" font-weight="800" fill="var(--ink-primary)" text-anchor="middle">资源配比：20%</text>

    <!-- Section C: Bottom Topic Anchor Box (Fills lower card cleanly) -->
    <rect x="20" y="374" width="376" height="92" rx="10" fill="var(--canvas-bg)"/>
    <text x="38" y="406" class="mono" font-size="12" font-weight="800" fill="var(--ink-muted)">CORE HASHTAG ANCHORS</text>
    <text x="38" y="442" font-size="17" font-weight="800" fill="var(--ink-primary)">#跑鞋中底横评 #马拉松战靴</text>
