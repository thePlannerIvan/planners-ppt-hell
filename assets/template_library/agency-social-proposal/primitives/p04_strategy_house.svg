    <text x="28" y="38" class="mono" font-size="13" font-weight="800" fill="var(--ink-on-dark)" letter-spacing="1">PILLAR 04 · 溢价长尾</text>
    <text x="28" y="78" font-size="28" font-weight="900" fill="var(--ink-on-dark)">百年匠人档案</text>
    <text x="388" y="38" class="mono" font-size="12" font-weight="700" fill="var(--ink-on-dark)" text-anchor="end">CRAFT ARCHIVE</text>

    <!-- Section A: Strategic Task -->
